<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipto — Official Beta Testing & Evaluation Portal</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/milanraj-github/RECEIPTO/main/assets/icons/app_icon.png">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            cyber: {
              bg: '#050713',
              card: '#0a0f26',
              border: '#1a224a',
              hover: '#131c44',
              cyan: '#00f2fe',
              purple: '#7928ca',
              green: '#00e59b',
              pink: '#ff007a',
              amber: '#ffaa00',
              red: '#ff4d4d',
            }
          },
          animation: {
            'glow-pulse': 'glowPulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'spin-slow': 'spin 12s linear infinite',
          },
          keyframes: {
            glowPulse: {
              '0%, 100%': { opacity: '0.4' },
              '50%': { opacity: '0.8' },
            }
          }
        }
      }
    };
  </script>

  <!-- React 18, ReactDOM, Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase & Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      background-color: #050713;
      color: #f1f5f9;
      overflow-x: hidden;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #050713;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00f2fe;
    }
    .cyber-glass {
      background: rgba(10, 15, 38, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 242, 254, 0.15);
    }
    .cyber-glass-glow {
      box-shadow: 0 0 35px -5px rgba(0, 242, 254, 0.15), 0 0 15px -5px rgba(121, 40, 202, 0.2);
    }
    .neon-text {
      text-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
    }
  </style>
</head>
<body class="min-h-screen relative font-sans antialiased selection:bg-cyan-500 selection:text-black">
  <!-- Living Canvas Background -->
  <canvas id="neuralCanvas" class="fixed inset-0 pointer-events-none z-0 opacity-40"></canvas>

  <!-- React Root Container -->
  <div id="root" class="relative z-10"></div>

  <!-- React Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Supabase Cloud Credentials ---
    const SUPABASE_URL = 'https://ykqzefulvpqfiwsddnqt.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlrcXplZnVsdnBxZml3c2RkbnF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3NTI2NTcsImV4cCI6MjA5ODMyODY1N30.NFm5dT7vVeHtziEkYWN-qk8ZEogpktPZ7NTmXDLO1Qs';
    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;

    // Default registered beta testers fallback
    const DEFAULT_WHITELIST = [
      'milanrajbow@gmail.com',
      'milanraj616@gmail.com',
      'sagar.23cs125@sode-edu.in',
      'rajanipatkar44@gmail.com',
      'ravidaspatkar@gmail.com',
      'manya.23cs070@sode-edu.in',
      'anithakunder616@gmail.com',
      'unknownperson12251978@gmail.com'
    ];

    const FEATURE_CONFIG = [
      { key: 'nlp_ocr', name: 'NLP OCR Receipt Parsing', icon: '🤖', desc: 'Auto extraction of merchant, total, date & items' },
      { key: 'receipts', name: 'Receipt Vault & Search', icon: '🧾', desc: 'Encrypted storage with instant keyword search' },
      { key: 'warranty', name: 'Warranty Tracker', icon: '🛡️', desc: 'Automatic expiry countdown and warranty duration' },
      { key: 'reminders', name: 'Expiry Reminders', icon: '⏰', desc: 'Scheduled notification before warranty lapses' },
      { key: 'ai_assistant', name: 'AI Financial Assistant', icon: '💡', desc: 'Intelligent queries about spending trends' },
      { key: 'analytics', name: 'Spending Analytics', icon: '📊', desc: 'Category breakdown and monthly spending charts' },
      { key: 'pdf', name: 'PDF Invoice & Report Export', icon: '📄', desc: 'One-click clean PDF receipt and warranty sheets' },
      { key: 'whatsapp', name: 'WhatsApp Bot Sync', icon: '💬', desc: 'Forward receipt photos via WhatsApp bot' }
    ];

    function App() {
      // --- State ---
      const [step, setStep] = useState(1);
      const [feedbacks, setFeedbacks] = useState([]);
      const [whitelist, setWhitelist] = useState(DEFAULT_WHITELIST);
      const [loadingFeedbacks, setLoadingFeedbacks] = useState(true);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [toast, setToast] = useState(null);
      const [submittedSuccess, setSubmittedSuccess] = useState(false);
      const [expandedCardId, setExpandedCardId] = useState(null);

      // Form Data
      const [formData, setFormData] = useState({
        name: '',
        email: '',
        deviceModel: '',
        androidVersion: 'Android 14',
        appVersion: '1.0.0 (Build 3)',
        testingDuration: '1–3 days',
        overallRating: 5,
        easeOfUse: 'Very Easy',
        features: {
          nlp_ocr: 5,
          receipts: 5,
          warranty: 5,
          reminders: 5,
          ai_assistant: 5,
          analytics: 5,
          pdf: 5,
          whatsapp: 5
        },
        manualCorrection: 'Rarely',
        uiDesign: 5,
        uiNav: 5,
        uiSpeed: 5,
        crashFrequency: 'Never',
        delayFrequency: 'Never',
        favFeature: '',
        impressedFeature: '',
        improvements: '',
        futureWishes: '',
        devMessage: '',
        continueUsing: 'Definitely Yes',
        hasBug: false,
        bugReport: {
          feature: 'General',
          severity: 'Low',
          description: '',
          steps: '',
          expected: '',
          actual: ''
        }
      });

      // Show toast helper
      const showToast = (title, message, type = 'info') => {
        setToast({ title, message, type });
        setTimeout(() => setToast(null), 4000);
      };

      // --- Online Data Fetching from Supabase ---
      const fetchCloudData = async () => {
        if (!supabase) return;
        setLoadingFeedbacks(true);
        try {
          const { data, error } = await supabase
            .from('feedbacks')
            .select('*')
            .order('created_at', { ascending: false });

          if (!error && data) {
            // 1. Extract Whitelist if present in system config row
            const configRow = data.find(r => r.name === '__SYSTEM_CONFIG_WHITELIST__' || r.email === 'system@receipto.whitelist');
            if (configRow) {
              try {
                const parsedConfig = JSON.parse(configRow.message);
                if (parsedConfig && Array.isArray(parsedConfig.whitelist) && parsedConfig.whitelist.length > 0) {
                  setWhitelist(parsedConfig.whitelist);
                }
              } catch (e) {}
            }

            // 2. Extract ONLY REAL user feedbacks (filter out system config)
            const realFeedbacks = data
              .filter(r => r.name !== '__SYSTEM_CONFIG_WHITELIST__' && r.email !== 'system@receipto.whitelist')
              .map(row => {
                let parsed = null;
                try {
                  if (row.message && typeof row.message === 'string' && (row.message.startsWith('{') || row.message.startsWith('['))) {
                    parsed = JSON.parse(row.message);
                  }
                } catch (e) {}

                const ft = (parsed && parsed.features) ? parsed.features : (row.features || {});
                const sug = (parsed && parsed.suggestions) ? parsed.suggestions : {
                  favFeature: (parsed && parsed.favFeature) || (row.message && !row.message.startsWith('{') ? row.message : ''),
                  impressedFeature: (parsed && parsed.impressedFeature) || '',
                  improvements: (parsed && parsed.improvements) || '',
                  futureWishes: (parsed && parsed.futureWishes) || '',
                  devMessage: (parsed && parsed.devMessage) || ''
                };

                return {
                  id: row.id,
                  name: row.name || 'Anonymous Tester',
                  email: row.email || '',
                  device: row.device || 'Android Device',
                  rating: parseInt(row.rating) || 5,
                  message: (parsed && parsed.message) ? parsed.message : (row.message || ''),
                  features: ft,
                  suggestions: sug,
                  finalEvaluation: (parsed && parsed.finalEvaluation) || {
                    continueUsing: 'Definitely Yes',
                    devMessage: sug.devMessage || ''
                  },
                  bugReport: (parsed && parsed.bugReport) ? parsed.bugReport : null,
                  hasBug: parsed ? (parsed.hasBug || false) : (row.tags && row.tags.some(t => t.includes('Bug'))),
                  appVersion: (parsed && parsed.appVersion) || '1.0.0 (Build 3)',
                  testingDuration: (parsed && parsed.testingDuration) || '1–3 days',
                  date: row.created_at ? new Date(row.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Recently'
                };
              });

            // Set purely real feedbacks from Supabase
            setFeedbacks(realFeedbacks);
          }
        } catch (err) {
          console.error('Error fetching Supabase feedbacks:', err);
        } finally {
          setLoadingFeedbacks(false);
        }
      };

      useEffect(() => {
        fetchCloudData();

        // Optional realtime subscription
        if (supabase) {
          const channel = supabase
            .channel('public:feedbacks')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'feedbacks' }, () => {
              fetchCloudData();
            })
            .subscribe();

          return () => {
            supabase.removeChannel(channel);
          };
        }
      }, []);

      // Email Whitelist Check
      const emailStatus = useMemo(() => {
        const email = formData.email.trim().toLowerCase();
        if (!email) return null;
        if (!email.includes('@') || !email.includes('.')) {
          return { allowed: false, invalidFormat: true };
        }
        const isAllowed = whitelist.map(e => e.toLowerCase()).includes(email);
        return { allowed: isAllowed, invalidFormat: false };
      }, [formData.email, whitelist]);

      // Step 1 Validation
      const handleNextStep1 = () => {
        if (!formData.name.trim()) {
          showToast('Name Required', 'Please enter your full name.', 'warning');
          return;
        }
        if (!formData.email.trim() || !formData.email.includes('@')) {
          showToast('Invalid Email', 'Please enter a valid email address.', 'warning');
          return;
        }
        if (!emailStatus || !emailStatus.allowed) {
          showToast('Access Restricted', 'Only authorized beta testers can submit evaluations. You can browse all community feedback below!', 'warning');
          return;
        }
        if (!formData.deviceModel.trim()) {
          showToast('Device Required', 'Please specify your Android device model.', 'warning');
          return;
        }
        setStep(2);
        window.scrollTo({ top: 380, behavior: 'smooth' });
      };

      // Final Submission to Supabase
      const handleSubmit = async (e) => {
        if (e) e.preventDefault();
        if (!emailStatus || !emailStatus.allowed) {
          showToast('Access Denied', 'Only authorized beta testers can submit evaluations.', 'error');
          setStep(1);
          return;
        }

        setIsSubmitting(true);
        try {
          const cloudPayload = {
            message: formData.favFeature
              ? `★ Favourite: "${formData.favFeature}". Improve: "${formData.improvements}"`
              : `Overall Experience: ${formData.overallRating}/5. Testing duration: ${formData.testingDuration}.`,
            suggestions: {
              favFeature: formData.favFeature,
              impressedFeature: formData.impressedFeature,
              improvements: formData.improvements,
              futureWishes: formData.futureWishes,
              devMessage: formData.devMessage
            },
            finalEvaluation: {
              overallSatisfaction: formData.overallRating,
              continueUsing: formData.continueUsing,
              devMessage: formData.devMessage
            },
            features: formData.features,
            uiUx: {
              design: formData.uiDesign,
              nav: formData.uiNav,
              speed: formData.uiSpeed,
              crashFrequency: formData.crashFrequency,
              delayFrequency: formData.delayFrequency
            },
            easeOfUse: formData.easeOfUse,
            testingDuration: formData.testingDuration,
            appVersion: formData.appVersion,
            hasBug: formData.hasBug,
            bugReport: formData.hasBug ? formData.bugReport : null
          };

          const insertPayload = {
            name: formData.name,
            email: formData.email,
            device: `${formData.deviceModel} (${formData.androidVersion})`,
            rating: formData.overallRating,
            message: JSON.stringify(cloudPayload),
            tags: [
              `v${formData.appVersion.split(' ')[0]}`,
              formData.testingDuration,
              formData.hasBug ? '⚠️ Bug Logged' : '✅ Smooth'
            ]
          };

          if (supabase) {
            const { data, error } = await supabase.from('feedbacks').insert([insertPayload]).select();
            if (error) throw error;
          }

          // Trigger Confetti
          if (window.confetti) {
            window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
          }

          setSubmittedSuccess(true);
          showToast('Success!', 'Thank you! Your beta evaluation is live on the Community Wall.', 'success');
          await fetchCloudData();
        } catch (err) {
          console.error('Submission error:', err);
          showToast('Submission Error', err.message || 'Failed to submit to database. Please retry.', 'error');
        } finally {
          setIsSubmitting(false);
        }
      };

      // Delete from Supabase directly
      const handleDeleteFeedback = async (id) => {
        if (!confirm('Are you sure you want to permanently delete this evaluation from the cloud?')) return;
        try {
          if (supabase) {
            const { error } = await supabase.from('feedbacks').delete().eq('id', id);
            if (error) throw error;
          }
          setFeedbacks(prev => prev.filter(f => f.id !== id));
          showToast('Deleted', 'Evaluation permanently removed from cloud database.', 'info');
        } catch (err) {
          showToast('Delete Failed', err.message, 'error');
        }
      };

      // Summary Statistics (Calculated purely from Supabase online feedbacks)
      const stats = useMemo(() => {
        const total = feedbacks.length;
        if (total === 0) return { avg: '5.0', total: 0, bugs: 0 };
        const sum = feedbacks.reduce((acc, f) => acc + (f.rating || 5), 0);
        const bugs = feedbacks.filter(f => f.hasBug || f.bugReport).length;
        return {
          avg: (sum / total).toFixed(1),
          total,
          bugs
        };
      }, [feedbacks]);

      return (
        <div className="min-h-screen text-slate-100 flex flex-col justify-between">
          
          {/* --- Navigation Bar --- */}
          <header className="sticky top-0 z-50 cyber-glass border-b border-cyan-500/20 px-4 lg:px-8 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 p-[2px] shadow-lg shadow-cyan-500/20">
                <div className="w-full h-full bg-[#050713] rounded-[10px] flex items-center justify-center font-bold text-cyan-400 text-lg">
                  R
                </div>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="font-extrabold tracking-wider text-white text-base">RECEIPTO</span>
                  <span className="text-[10px] uppercase font-mono px-2 py-0.5 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">
                    BETA 1.0.0
                  </span>
                </div>
                <p className="text-xs text-slate-400 hidden sm:block">Financial Intelligence & Automated Warranty Vault</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <div className="hidden md:flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-mono">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Supabase Live Cloud</span>
              </div>

              <a
                href="#communityWall"
                className="text-xs px-3 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700 transition"
              >
                Community Wall ({stats.total})
              </a>

              <a
                href="/admin"
                className="text-xs px-3 py-1.5 rounded-lg bg-purple-950/40 hover:bg-purple-900/60 text-purple-300 border border-purple-500/30 transition flex items-center gap-1.5 font-medium"
              >
                <span>⚙️</span>
                <span>Admin</span>
              </a>
            </div>
          </header>

          {/* --- Hero Banner --- */}
          <main className="max-w-5xl mx-auto px-4 py-8 flex-1 w-full">
            <div className="text-center mb-8">
              <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 text-xs font-mono mb-4">
                <span>🛡️</span>
                <span>Google Play Closed Beta Testing Group</span>
              </div>
              <h1 className="text-3xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white via-cyan-200 to-purple-400 tracking-tight mb-3">
                Receipto Beta Testing Evaluation
              </h1>
              <p className="text-slate-400 text-sm sm:text-base max-w-2xl mx-auto leading-relaxed">
                Thank you for testing Receipto. Your detailed evaluations directly shape our automated warranty engine and official Google Play release.
              </p>

              {/* Stats Bar */}
              <div className="grid grid-cols-3 gap-3 max-w-lg mx-auto mt-6">
                <div className="cyber-glass rounded-xl p-3 text-center border-cyan-500/20">
                  <div className="text-2xl font-black text-cyan-400">★ {stats.avg}</div>
                  <div className="text-[11px] text-slate-400 uppercase tracking-wider mt-0.5">Community Avg</div>
                </div>
                <div className="cyber-glass rounded-xl p-3 text-center border-purple-500/20">
                  <div className="text-2xl font-black text-purple-400">{stats.total}</div>
                  <div className="text-[11px] text-slate-400 uppercase tracking-wider mt-0.5">Verified Reviews</div>
                </div>
                <div className="cyber-glass rounded-xl p-3 text-center border-emerald-500/20">
                  <div className="text-2xl font-black text-emerald-400">{whitelist.length}</div>
                  <div className="text-[11px] text-slate-400 uppercase tracking-wider mt-0.5">Active Testers</div>
                </div>
              </div>
            </div>

            {/* --- Closed Beta Notice Card --- */}
            <div className="cyber-glass rounded-2xl p-4 sm:p-5 mb-8 border-cyan-500/30 bg-gradient-to-r from-cyan-950/20 via-purple-950/20 to-slate-900/40 flex items-start sm:items-center gap-4">
              <div className="text-2xl sm:text-3xl p-2.5 rounded-xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 shrink-0">
                🔒
              </div>
              <div className="text-xs sm:text-sm text-slate-300 leading-relaxed flex-1">
                <span className="font-bold text-cyan-300">Closed Beta Access Notice:</span> Submission of evaluations is open exclusively to authorized Google Play beta testers. Enter your registered email in Step 1 to unlock the full evaluation form. <span className="text-slate-400">All visitors can freely explore community reviews below!</span>
              </div>
            </div>

            {/* --- Success Thank You State --- */}
            {submittedSuccess ? (
              <div className="cyber-glass rounded-2xl p-8 text-center border-emerald-500/40 max-w-xl mx-auto my-8 cyber-glass-glow animate-fade-in">
                <div className="w-16 h-16 rounded-full bg-emerald-500/20 border border-emerald-500/50 flex items-center justify-center text-3xl mx-auto mb-4">
                  🚀
                </div>
                <h3 className="text-2xl font-black text-white mb-2">Evaluation Submitted Live!</h3>
                <p className="text-slate-300 text-sm mb-6 leading-relaxed">
                  Thank you, <strong className="text-cyan-400">{formData.name}</strong>. Your comprehensive feedback and diagnostic logs have been uploaded directly to our cloud database.
                </p>
                <div className="flex flex-wrap justify-center gap-3">
                  <button
                    onClick={() => {
                      setSubmittedSuccess(false);
                      setStep(1);
                    }}
                    className="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold transition"
                  >
                    Submit Another Feedback
                  </button>
                  <a
                    href="#communityWall"
                    className="px-5 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-purple-600 text-white text-xs font-semibold shadow-lg shadow-cyan-500/25 transition"
                  >
                    View Community Wall ↓
                  </a>
                </div>
              </div>
            ) : (
              /* --- Multi-Step Form Card --- */
              <div className="cyber-glass rounded-2xl p-5 sm:p-8 border-cyan-500/20 shadow-2xl relative overflow-hidden mb-16">
                
                {/* Stepper Header */}
                <div className="flex items-center justify-between pb-6 border-b border-slate-800/80 mb-6 overflow-x-auto gap-2">
                  {[
                    { num: 1, title: 'Tester Info' },
                    { num: 2, title: 'Experience & OCR' },
                    { num: 3, title: 'Core Features' },
                    { num: 4, title: 'UI/UX & Speed' },
                    { num: 5, title: 'Suggestions & Bugs' }
                  ].map(s => (
                    <button
                      key={s.num}
                      type="button"
                      onClick={() => {
                        if (s.num < step || (s.num === 2 && emailStatus && emailStatus.allowed)) {
                          setStep(s.num);
                        }
                      }}
                      className={`flex items-center gap-2 text-xs font-semibold px-3 py-1.5 rounded-xl transition shrink-0 ${
                        step === s.num
                          ? 'bg-gradient-to-r from-cyan-500/20 to-purple-600/20 border border-cyan-400 text-cyan-300'
                          : step > s.num
                          ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'
                          : 'bg-slate-900/60 text-slate-500 border border-slate-800'
                      }`}
                    >
                      <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] ${
                        step === s.num ? 'bg-cyan-400 text-black font-bold' : step > s.num ? 'bg-emerald-400 text-black font-bold' : 'bg-slate-800 text-slate-400'
                      }`}>
                        {step > s.num ? '✓' : s.num}
                      </span>
                      <span>{s.title}</span>
                    </button>
                  ))}
                </div>

                {/* --- STEP 1: TESTER INFORMATION --- */}
                {step === 1 && (
                  <div className="space-y-6 animate-fade-in">
                    <div>
                      <h2 className="text-xl font-bold text-white flex items-center gap-2">
                        <span>👤</span> <span>Tester Information</span>
                      </h2>
                      <p className="text-xs text-slate-400 mt-1">
                        Enter your tester profile details so we can correlate metrics against device models.
                      </p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1.5">

                      >
                        <span>Next: Overall Experience</span>
                        <span>→</span>
                      </button>
                    </div>

                {/* --- STEP 2: OVERALL EXPERIENCE & OCR --- */}

                          formData.overallRating === 4 ? 'Very Good Experience 👍' :

                              formData.easeOfUse === opt
                                ? 'bg-cyan-500/20 border-cyan-400 text-cyan-300 shadow-sm'
                                : 'bg-slate-900/60 border-slate-800 text-slate-400 hover:border-slate-700'
                            }`}

                            {opt}
                          </button>

                          <span className="text-amber-400 text-xs font-bold font-mono">{formData.features.nlp_ocr}★</span>
                        </div>
                        <div className="flex gap-1.5">

                      </button>
                    </div>
                  </div>

                          <div className="flex gap-1">
                            {[1, 2, 3, 4, 5].map(val => (
                              <button
                                key={val}
                                type="button"
                                onClick={() => setFormData({

                                  features: { ...formData.features, [feat.key]: val }

                                className={`flex-1 py-1 rounded text-xs transition ${
                                  val <= (formData.features[feat.key] || 5)
                                    ? 'bg-amber-400/20 text-amber-300 font-bold'
                                    : 'bg-slate-900 text-slate-600 hover:text-slate-400'
                                }`}
                              >
                                {val}★
                              </button>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>

                    <div className="pt-4 flex justify-between">
                      <button
                        type="button"
                        onClick={() => setStep(2)}

                        type="button"
                        onClick={() => {
                          setStep(4);
                          window.scrollTo({ top: 380, behavior: 'smooth' });

                      </button>
                    </div>
                  </div>

                {/* --- STEP 4: UI/UX & RELIABILITY --- */}

                        <span>🎨</span> <span>UI/UX, Performance & Diagnostics</span>

                      </p>

                        { label: 'Navigation Smoothness', key: 'uiNav' },
                        { label: 'App Response & Startup Speed', key: 'uiSpeed' }
                      ].map(item => (
                        <div key={item.key} className="cyber-glass rounded-xl p-4 border-slate-800 text-center">
                          <div className="text-xs font-semibold text-slate-300 mb-2">{item.label}</div>
                          <div className="text-lg font-bold text-amber-400 mb-2">{formData[item.key]}★</div>
                          <div className="flex justify-center gap-1">
                            {[1, 2, 3, 4, 5].map(s => (
                              <button
                                key={s}
                                type="button"
                                onClick={() => setFormData({ ...formData, [item.key]: s })}
                                className={`w-7 h-7 rounded text-xs ${s <= formData[item.key] ? 'bg-amber-400/20 text-amber-400' : 'bg-slate-900 text-slate-600'}`}

                            <option key={c} value={c}>{c}</option>

                        </select>

                            <option key={c} value={c}>{c}</option>
                          ))}

                          value={formData.favFeature}
                          onChange={e => setFormData({ ...formData, favFeature: e.target.value })}

                      <div>

                          type="text"

                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700/80 focus:border-amber-400 text-xs text-white outline-none transition"

                            className={`px-3 py-1 rounded-lg text-xs font-semibold transition ${
                              formData.hasBug ? 'bg-rose-500/20 border border-rose-500 text-rose-400' : 'bg-slate-900 text-slate-500 border border-slate-800'

                          >
                            Yes
                          </button>
                          <button
                            type="button"
                            onClick={() => setFormData({ ...formData, hasBug: false })}
                            className={`px-3 py-1 rounded-lg text-xs font-semibold transition ${
                              !formData.hasBug ? 'bg-emerald-500/20 border border-emerald-500 text-emerald-400' : 'bg-slate-900 text-slate-500 border border-slate-800'
                            }`}
                          >
                            No
                          </button>
                        </div>
                      </div>

                      {formData.hasBug && (

                                  bugReport: { ...formData.bugReport, feature: e.target.value }

                            <div>
                              <label className="block text-[11px] text-slate-400 mb-1">Severity</label>
                              <select
                                value={formData.bugReport.severity}
                                onChange={e => setFormData({
                                  ...formData,
                                  bugReport: { ...formData.bugReport, severity: e.target.value }
                                })}
                                className="w-full px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white outline-none"
                              >
                                {['Low (Cosmetic)', 'Medium (Annoying but works)', 'High (Feature broken)', 'Critical (App Crash)'].map(s => (
                                  <option key={s} value={s}>{s}</option>
                                ))}
                              </select>

                            <label className="block text-[11px] text-slate-400 mb-1">Bug Description & Steps to Reproduce</label>

                              value={formData.bugReport.description}

                                ...formData,
                                bugReport: { ...formData.bugReport, description: e.target.value }
                              })}
                              placeholder="Explain what happened and how to trigger it..."
                              className="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white outline-none"

                      >
                        {isSubmitting ? (
                          <>
                            <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                            <span>SUBMITTING TO CLOUD...</span>
                          </>
                        ) : (
                          <>
                            <span>SUBMIT EVALUATION</span>
                            <span>🚀</span>
                          </>
                        )}
                      </button>
                    </div>
                  </form>
                )}
              </div>
            )}

            {/* --- BETA TESTERS COMMUNITY WALL (100% ONLINE FROM SUPABASE) --- */}
            <section id="communityWall" className="pt-8">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
                <div>
                  <div className="flex items-center gap-2.5">
                    <span className="text-2xl">🌟</span>
                    <h2 className="text-2xl font-black text-white tracking-tight">Beta Testers Community Wall</h2>
                  </div>
                  <p className="text-xs text-slate-400 mt-1">
                    Live evaluations submitted by closed beta testers via Supabase cloud.
                  </p>
                </div>

                <div className="flex items-center gap-2">
                  <div className="px-3.5 py-1.5 rounded-xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 text-xs font-mono font-bold flex items-center gap-1.5">
                    <span>★ {stats.avg}</span>
                    <span className="text-slate-400">({stats.total} {stats.total === 1 ? 'Review' : 'Reviews'})</span>
                  </div>
                  <button
                    onClick={fetchCloudData}
                    className="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs transition"
                    title="Refresh from Supabase"
                  >
                    🔄
                  </button>
                </div>
              </div>

              {/* Loading State */}
              {loadingFeedbacks ? (
                <div className="cyber-glass rounded-2xl p-12 text-center border-slate-800">
                  <div className="w-8 h-8 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
                  <p className="text-xs text-slate-400">Fetching live evaluations from Supabase cloud...</p>
                </div>
              ) : feedbacks.length === 0 ? (
                /* Empty State (when 0 reviews are in cloud) */
                <div className="cyber-glass rounded-2xl p-12 text-center border-slate-800">
                  <div className="text-4xl mb-3">💬</div>
                  <h3 className="text-base font-bold text-white mb-1">No Feedback Entries Yet</h3>
                  <p className="text-xs text-slate-400 max-w-sm mx-auto mb-4">
                    All reviews are loaded in real-time from Supabase. Be the first registered beta tester to submit your evaluation above!
                  </p>
                  <button
                    onClick={() => {
                      setStep(1);
                      window.scrollTo({ top: 380, behavior: 'smooth' });
                    }}
                    className="px-4 py-2 rounded-xl bg-cyan-500/20 border border-cyan-400 text-cyan-300 text-xs font-semibold hover:bg-cyan-500/30 transition"
                  >
                    Submit Feedback ↑
                  </button>
                </div>
              ) : (
                /* Feedbacks List (Real Data from Supabase) */
                <div className="space-y-4">
                  {feedbacks.map(item => (
                    <div
                      key={item.id}
                      className="cyber-glass rounded-2xl p-5 border-slate-800/80 hover:border-cyan-500/30 transition shadow-lg"
                    >
                      {/* Card Top */}
                      <div className="flex items-start justify-between gap-3 mb-4">
                        <div className="flex items-center gap-3">
                          <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500/30 to-purple-500/30 border border-cyan-500/40 flex items-center justify-center font-bold text-cyan-300 text-base">
                            {(item.name || 'T')[0].toUpperCase()}
                          </div>
                          <div>
                            <div className="font-bold text-white text-sm flex items-center gap-2">
                              <span>{item.name}</span>
                              <span className="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-mono">
                                Verified Tester
                              </span>
                            </div>
                            <div className="text-xs text-slate-400 mt-0.5 font-mono">
                              {item.device} • {item.date}
                            </div>
                          </div>
                        </div>

                        <div className="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-amber-400/10 border border-amber-400/30 text-amber-300 text-xs font-bold font-mono">
                          <span>★ {item.rating}.0</span>
                        </div>
                      </div>

                      {/* Feature Tags Grid */}
                      {item.features && Object.keys(item.features).length > 0 && (
                        <div className="flex flex-wrap gap-1.5 mb-3.5">
                          {Object.entries(item.features).map(([k, val]) => (
                            <span
                              key={k}
                              className="text-[11px] font-mono px-2 py-0.5 rounded-md bg-slate-900 border border-slate-800 text-slate-300 flex items-center gap-1"
                            >
                              <span className="text-slate-500">{k.replace('_', ' ')}:</span>
                              <span className="text-amber-400 font-bold">{val}★</span>
                            </span>
                          ))}
                        </div>
                      )}

                      {/* Feedback Quotes */}
                      <div className="space-y-2 text-xs">
                        {item.suggestions.favFeature && (
                          <div className="p-3 rounded-xl bg-cyan-950/20 border-l-2 border-cyan-400 text-slate-300">
                            <span className="font-bold text-cyan-300 block text-[11px] uppercase tracking-wider mb-0.5">
                              ❤️ Favourite Feature
                            </span>
                            "{item.suggestions.favFeature}"
                          </div>
                        )}

                        {item.suggestions.improvements && (
                          <div className="p-3 rounded-xl bg-amber-950/20 border-l-2 border-amber-400 text-slate-300">
                            <span className="font-bold text-amber-300 block text-[11px] uppercase tracking-wider mb-0.5">
                              💡 Suggested Improvement
                            </span>
                            "{item.suggestions.improvements}"
                          </div>
                        )}

                        {item.suggestions.futureWishes && (
                          <div className="p-3 rounded-xl bg-purple-950/20 border-l-2 border-purple-400 text-slate-300">
                            <span className="font-bold text-purple-300 block text-[11px] uppercase tracking-wider mb-0.5">
                              ✨ Future Wishlist
                            </span>
                            "{item.suggestions.futureWishes}"
                          </div>
                        )}
                      </div>

                      {/* Expandable Details */}
                      {expandedCardId === item.id && (
                        <div className="mt-3 pt-3 border-t border-slate-800 text-xs text-slate-400 space-y-2 animate-fade-in">
                          <div className="grid grid-cols-2 gap-2 text-[11px] font-mono">
                            <div>App Version: <span className="text-white">{item.appVersion}</span></div>
                            <div>Testing Duration: <span className="text-white">{item.testingDuration}</span></div>
                          </div>
                          {item.suggestions.devMessage && (
                            <div className="p-2.5 rounded-lg bg-emerald-950/20 border border-emerald-500/30 text-emerald-300 text-xs">
                              <strong>Note to Dev:</strong> "{item.suggestions.devMessage}"
                            </div>
                          )}
                          {item.hasBug && item.bugReport && (
                            <div className="p-2.5 rounded-lg bg-rose-950/20 border border-rose-500/30 text-rose-300 text-xs">
                              <strong>⚠️ Bug Diagnostic ({item.bugReport.feature} - {item.bugReport.severity}):</strong> {item.bugReport.description}
                            </div>
                          )}
                        </div>
                      )}

                      {/* Card Footer */}
                      <div className="mt-3 pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs">
                        <button
                          type="button"
                          onClick={() => setExpandedCardId(expandedCardId === item.id ? null : item.id)}
                          className="text-cyan-400 hover:text-cyan-300 transition flex items-center gap-1 font-medium"
                        >
                          <span>{expandedCardId === item.id ? 'Hide Details ▲' : 'View Full Details ▼'}</span>
                        </button>

                        <button
                          type="button"
                          onClick={() => handleDeleteFeedback(item.id)}
                          className="text-rose-400/80 hover:text-rose-300 px-2 py-0.5 rounded bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 transition text-[11px]"
                          title="Delete from Supabase"
                        >
                          🗑️ Delete
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </section>
          </main>

          {/* --- Toast Notification --- */}
          {toast && (
            <div className={`fixed bottom-5 right-5 z-50 p-4 rounded-xl shadow-2xl flex items-center gap-3 border text-xs sm:text-sm animate-bounce-in ${
              toast.type === 'success' ? 'bg-emerald-950/90 border-emerald-500 text-emerald-200' :
              toast.type === 'error' ? 'bg-rose-950/90 border-rose-500 text-rose-200' :
              toast.type === 'warning' ? 'bg-amber-950/90 border-amber-500 text-amber-200' :
              'bg-slate-900/90 border-cyan-500 text-cyan-200'
            }`}>
              <span className="text-xl">
                {toast.type === 'success' ? '🎉' : toast.type === 'error' ? '❌' : toast.type === 'warning' ? '⚠️' : 'ℹ️'}
              </span>
              <div>
                <div className="font-bold">{toast.title}</div>
                <div className="text-xs opacity-90">{toast.message}</div>
              </div>
            </div>
          )}

          {/* --- Footer --- */}
          <footer className="border-t border-slate-800/80 py-6 text-center text-xs text-slate-500 bg-[#04060f]">
            <div className="max-w-5xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div>© 2026 Receipto AI Financial Vault. All rights reserved.</div>
              <div className="flex gap-4">
                <a href="/privacy-policy" className="hover:text-cyan-400 transition">Privacy Policy</a>
                <a href="/admin" className="hover:text-cyan-400 transition">Admin Portal</a>
                <a href="https://github.com/milanraj-github/RECEIPTO" target="_blank" className="hover:text-cyan-400 transition">GitHub</a>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Render React to DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    // Living Canvas Particle Background
    (function() {
      const canvas = document.getElementById('neuralCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let particles = [];
      const particleCount = 40;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          radius: Math.random() * 1.5 + 0.8
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(0, 242, 254, 0.4)';
        ctx.strokeStyle = 'rgba(121, 40, 202, 0.12)';

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < 0) p.x = canvas.width;
          if (p.x > canvas.width) p.x = 0;
          if (p.y < 0) p.y = canvas.height;
          if (p.y > canvas.height) p.y = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();

          for (let j = i + 1; j < particles.length; j++) {
            const p2 = particles[j];
            const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (dist < 110) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>
</body>
</html>
