                      </p>
                    </div>

                    <div className="space-y-4">
                      <div>
                        <label className="block text-xs font-semibold text-cyan-300 mb-1">
                          Favourite Feature
                        </label>
                        <input
                          type="text"
                          value={formData.favFeature}
                          onChange={e => setFormData({ ...formData, favFeature: e.target.value })}
                          placeholder="e.g. PaddleOCR automated receipt parsing and warranty expiry notification"
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700/80 focus:border-cyan-400 text-xs text-white outline-none transition"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-amber-300 mb-1">
                          What could be improved?
                        </label>
                        <input
                          type="text"
                          value={formData.improvements}
                          onChange={e => setFormData({ ...formData, improvements: e.target.value })}
                          placeholder="e.g. Add multi-currency support, faster batch camera scan"
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700/80 focus:border-amber-400 text-xs text-white outline-none transition"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-purple-300 mb-1">
                          Future Wishlist
                        </label>
                        <input
                          type="text"
                          value={formData.futureWishes}
                          onChange={e => setFormData({ ...formData, futureWishes: e.target.value })}
                          placeholder="e.g. Google Drive automated cloud backup, shared family vault"
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700/80 focus:border-purple-400 text-xs text-white outline-none transition"
                        />
                      </div>

                      {/* ITEM 1: DIRECT MESSAGE TO RECEIPTO TEAM (UPDATED PLACEHOLDER & LABEL) */}
                      <div>
                        <label className="block text-xs font-semibold text-emerald-300 mb-1">
                          Direct Message to Receipto Team
                        </label>
                        <textarea
                          rows="2"
                          value={formData.devMessage}
                          onChange={e => setFormData({ ...formData, devMessage: e.target.value })}
                          placeholder="Any thoughts, encouraging words, or specific feedback for Receipto Team..."
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700/80 focus:border-emerald-400 text-xs text-white outline-none transition"
                        ></textarea>
                      </div>
                    </div>

                    {/* Bug Report Section */}
                    <div className="cyber-glass rounded-xl p-4 border-slate-800">
                      <div className="flex items-center justify-between mb-3">
                        <span className="text-xs font-bold text-slate-200 flex items-center gap-1.5">
                          <Icons.Bug className="w-4 h-4 text-rose-400" />
                          <span>Did you encounter any bugs or unexpected behavior?</span>
                        </span>
                        <div className="flex gap-2">
                          <button
                            type="button"
                            onClick={() => setFormData({ ...formData, hasBug: true })}
                            className={`px-3 py-1 rounded-lg text-xs font-semibold transition ${
                              formData.hasBug ? 'bg-rose-500/20 border border-rose-500 text-rose-400' : 'bg-slate-900 text-slate-500 border border-slate-800'
                            }`}
                          >
                            Yes
                          </button>
                          <button
                            type="button"
                            onClick={() => setFormData({ ...formData, hasBug: false })}
                            className={`px-3 py-1 rounded-lg text-xs font-semibold transition ${
                              !formData.hasBug ? 'bg-emerald-500/20 border border-emerald-500 text-emerald-400' : 'bg-slate-900 text-slate-500 border border-slate-800'
                            }`}
                          >
                            No
                          </button>
                        </div>
                      </div>

                      {formData.hasBug && (
                        <div className="space-y-3 pt-3 border-t border-slate-800">
                          <div className="grid grid-cols-2 gap-3">
                            <div>
                              <label className="block text-[11px] text-slate-400 mb-1">Feature Area</label>
                              <select
                                value={formData.bugReport.feature}
                                onChange={e => setFormData({
                                  ...formData,
                                  bugReport: { ...formData.bugReport, feature: e.target.value }
                                })}
                                className="w-full px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white outline-none"
                              >
                                {['Camera / Scanning', 'NLP OCR Extraction', 'Warranty Reminders', 'AI Assistant', 'PDF Export', 'WhatsApp Bot', 'Authentication', 'Other'].map(f => (
                                  <option key={f} value={f}>{f}</option>
                                ))}
                              </select>
                            </div>
                            <div>
                              <label className="block text-[11px] text-slate-400 mb-1">Severity</label>
                              <select
                                value={formData.bugReport.severity}
                                onChange={e => setFormData({
                                  ...formData,
                                  bugReport: { ...formData.bugReport, severity: e.target.value }
                                })}
                                className="w-full px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white outline-none"
                              >
                                {['Low (Cosmetic)', 'Medium (Annoying but works)', 'High (Feature broken)', 'Critical (App Crash)'].map(s => (
                                  <option key={s} value={s}>{s}</option>
                                ))}
                              </select>
                            </div>
                          </div>
                          <div>
                            <label className="block text-[11px] text-slate-400 mb-1">Bug Description & Steps to Reproduce</label>
                            <textarea
                              rows="2"
                              value={formData.bugReport.description}
                              onChange={e => setFormData({
                                ...formData,
                                bugReport: { ...formData.bugReport, description: e.target.value }
                              })}
                              placeholder="Explain what happened and how to trigger it..."
                              className="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white outline-none"
                            ></textarea>
                          </div>
                        </div>
                      )}
                    </div>

                    <div className="pt-4 flex justify-between items-center">
                      <button
                        type="button"
                        onClick={() => setStep(4)}
                        className="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs transition"
                      >
                        ← Back
                      </button>
                      <button
                        type="submit"
                        disabled={isSubmitting}
                        className="px-8 py-3 rounded-xl brand-gradient hover:opacity-95 text-white font-extrabold text-sm shadow-xl shadow-cyan-500/25 flex items-center gap-2 transition disabled:opacity-50"
                      >
                        {isSubmitting ? (
                          <>
                            <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                            <span>SUBMITTING TO CLOUD...</span>
                          </>
                        ) : (
                          <>
                            <span>SUBMIT EVALUATION</span>
                            <Icons.Send className="w-4 h-4" />
                          </>
                        )}
                      </button>
                    </div>
                  </form>
                )}
              </div>
            )}

            {/* COMMUNITY WALL (100% ONLINE DIRECT FROM SUPABASE) */}
            <section id="communityWall" className="pt-8">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
                <div>
                  <div className="flex items-center gap-2.5">
                    <Icons.Star className="w-6 h-6 text-amber-400" />
                    <h2 className="text-2xl font-black text-white tracking-tight">Beta Testers Community Wall</h2>
                  </div>
                  <p className="text-xs text-slate-400 mt-1">
                    Live evaluations submitted by closed beta testers via Supabase cloud.
                  </p>
                </div>

                <div className="flex items-center gap-2">
                  <div className="px-3.5 py-1.5 rounded-xl bg-cyan-500/15 border border-cyan-500/35 text-cyan-300 text-xs font-mono font-bold flex items-center gap-1.5">
                    <Icons.Star className="w-3.5 h-3.5 text-amber-400" />
                    <span>{stats.avg}</span>
                    <span className="text-slate-400">({stats.total} {stats.total === 1 ? 'Review' : 'Reviews'})</span>
                  </div>
                  <button
                    onClick={fetchCloudData}
                    className="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition"
                    title="Refresh from Supabase"
                  >
                    <Icons.Refresh className="w-3.5 h-3.5" />
                  </button>
                </div>
              </div>

              {loadingFeedbacks ? (
                <div className="cyber-glass rounded-2xl p-12 text-center border-slate-800">
                  <div className="w-8 h-8 border-2 border-cyan-400 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
                  <p className="text-xs text-slate-400">Fetching live evaluations from Supabase cloud...</p>
                </div>
              ) : feedbacks.length === 0 ? (
                <div className="cyber-glass rounded-2xl p-12 text-center border-slate-800">
                  <div className="w-12 h-12 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 mx-auto mb-3">
                    <Icons.MessageCircle className="w-6 h-6" />
                  </div>
                  <h3 className="text-base font-bold text-white mb-1">No Feedback Entries Yet</h3>
                  <p className="text-xs text-slate-400 max-w-sm mx-auto mb-4">
                    All reviews are loaded in real-time from Supabase. Be the first registered beta tester to submit your evaluation above!
                  </p>
                  <button
                    onClick={() => { setStep(1); window.scrollTo({ top: 380, behavior: 'smooth' }); }}
                    className="px-4 py-2 rounded-xl bg-cyan-500/20 border border-cyan-400 text-cyan-300 text-xs font-semibold hover:bg-cyan-500/30 transition"
                  >
                    Submit Feedback ↑
                  </button>
                </div>
              ) : (
                <div className="space-y-4">
                  {feedbacks.map(item => (
                    <div
                      key={item.id}
                      className="cyber-glass rounded-2xl p-5 border-slate-800/80 hover:border-cyan-500/30 transition shadow-lg"
                    >
                      <div className="flex items-start justify-between gap-3 mb-4">
                        <div className="flex items-center gap-3">
                          <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500/30 to-purple-500/30 border border-cyan-500/40 flex items-center justify-center font-bold text-cyan-300 text-base">
                            {(item.name || 'T')[0].toUpperCase()}
                          </div>
                          <div>
                            <div className="font-bold text-white text-sm flex items-center gap-2">
                              <span>{item.name}</span>
                              <span className="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-mono flex items-center gap-1">
                                <Icons.CheckCircle className="w-2.5 h-2.5" />
                                <span>Verified Tester</span>
                              </span>
                            </div>
                            <div className="text-xs text-slate-400 mt-0.5 font-mono">
                              {item.device} • {item.date}
                            </div>
                          </div>
                        </div>

                        <div className="flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-amber-400/10 border border-amber-400/30 text-amber-300 text-xs font-bold font-mono">
                          <Icons.Star className="w-3.5 h-3.5" />
                          <span>{item.rating}.0</span>
                        </div>
                      </div>

                      {item.features && Object.keys(item.features).length > 0 && (
                        <div className="flex flex-wrap gap-1.5 mb-3.5">
                          {Object.entries(item.features).map(([k, val]) => (
                            <span
                              key={k}
                              className="text-[11px] font-mono px-2 py-0.5 rounded-md bg-slate-900 border border-slate-800 text-slate-300 flex items-center gap-1"
                            >
                              <span className="text-slate-500">{k.replace('_', ' ')}:</span>
                              <span className="text-amber-400 font-bold">{val}★</span>
                            </span>
                          ))}
                        </div>
                      )}

                      <div className="space-y-2 text-xs">
                        {item.suggestions.favFeature && (
                          <div className="p-3 rounded-xl bg-cyan-950/20 border-l-2 border-cyan-400 text-slate-300">
                            <span className="font-bold text-cyan-300 block text-[11px] uppercase tracking-wider mb-0.5">
                              Favourite Feature
                            </span>
                            "{item.suggestions.favFeature}"
                          </div>
                        )}

                        {item.suggestions.improvements && (
                          <div className="p-3 rounded-xl bg-amber-950/20 border-l-2 border-amber-400 text-slate-300">
                            <span className="font-bold text-amber-300 block text-[11px] uppercase tracking-wider mb-0.5">
                              Suggested Improvement
                            </span>
                            "{item.suggestions.improvements}"
                          </div>
                        )}

                        {item.suggestions.futureWishes && (
                          <div className="p-3 rounded-xl bg-purple-950/20 border-l-2 border-purple-400 text-slate-300">
                            <span className="font-bold text-purple-300 block text-[11px] uppercase tracking-wider mb-0.5">
                              Future Wishlist
                            </span>
                            "{item.suggestions.futureWishes}"
                          </div>
                        )}
                      </div>

                      {expandedCardId === item.id && (
                        <div className="mt-3 pt-3 border-t border-slate-800 text-xs text-slate-400 space-y-2">
                          <div className="grid grid-cols-2 gap-2 text-[11px] font-mono">
                            <div>App Version: <span className="text-white">{item.appVersion}</span></div>
                            <div>Testing Duration: <span className="text-white">{item.testingDuration}</span></div>
                          </div>
                          {item.suggestions.devMessage && (
                            <div className="p-2.5 rounded-lg bg-emerald-950/20 border border-emerald-500/30 text-emerald-300 text-xs">
                              <strong>Note to Team:</strong> "{item.suggestions.devMessage}"
                            </div>
                          )}
                          {item.hasBug && item.bugReport && (
                            <div className="p-2.5 rounded-lg bg-rose-950/20 border border-rose-500/30 text-rose-300 text-xs">
                              <strong>Bug Diagnostic ({item.bugReport.feature} - {item.bugReport.severity}):</strong> {item.bugReport.description}
                            </div>
                          )}
                        </div>
                      )}

                      {/* Card Footer with REAL VECTOR TRASH CAN */}
                      <div className="mt-3 pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs">
                        <button
                          type="button"
                          onClick={() => setExpandedCardId(expandedCardId === item.id ? null : item.id)}
                          className="text-cyan-400 hover:text-cyan-300 transition flex items-center gap-1 font-medium"
                        >
                          <span>{expandedCardId === item.id ? 'Hide Details ▲' : 'View Full Details ▼'}</span>
                        </button>

                        <button
                          type="button"
                          onClick={() => handleDeleteFeedback(item.id)}
                          className="text-rose-400 hover:text-rose-300 px-2.5 py-1 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 transition text-[11px] flex items-center gap-1 font-medium"
                          title="Delete from Supabase"
                        >
                          <Icons.Trash className="w-3.5 h-3.5" />
                          <span>Delete</span>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </section>
          </main>

          {/* Toast Notification */}
          {toast && (
            <div className={`fixed bottom-5 right-5 z-50 p-4 rounded-xl shadow-2xl flex items-center gap-3 border text-xs sm:text-sm ${
              toast.type === 'success' ? 'bg-emerald-950/90 border-emerald-500 text-emerald-200' :
              toast.type === 'error' ? 'bg-rose-950/90 border-rose-500 text-rose-200' :
              toast.type === 'warning' ? 'bg-amber-950/90 border-amber-500 text-amber-200' :
              'bg-slate-900/90 border-cyan-500 text-cyan-200'
            }`}>
              <div>
                <div className="font-bold">{toast.title}</div>
                <div className="text-xs opacity-90">{toast.message}</div>
              </div>
            </div>
          )}

          <footer className="border-t border-slate-800/80 py-6 text-center text-xs text-slate-500 bg-[#050816]">

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    // Particles with Cyan and Pink
    (function() {
      const canvas = document.getElementById('neuralCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let particles = [];
      const particleCount = 48;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.45,
          vy: (Math.random() - 0.5) * 0.45,
          radius: Math.random() * 1.8 + 0.9,
          color: i % 2 === 0 ? 'rgba(0, 210, 255, 0.70)' : 'rgba(224, 64, 251, 0.70)'
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = canvas.width;
          if (p.x > canvas.width) p.x = 0;
          if (p.y < 0) p.y = canvas.height;
          if (p.y > canvas.height) p.y = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();

          for (let j = i + 1; j < particles.length; j++) {
            const p2 = particles[j];
            const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (dist < 115) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = i % 2 === 0 ? 'rgba(0, 210, 255, 0.22)' : 'rgba(224, 64, 251, 0.22)';
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>
