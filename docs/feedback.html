<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipto — Official Beta Testing & Evaluation Portal</title>
  <link rel="icon" type="image/png" href="/logo.png">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            cyber: {
              bg: '#050816',
              card: '#0c132e',
              border: 'rgba(0, 210, 255, 0.25)',
              hover: '#131e48',
              cyan: '#00d2ff',
              magenta: '#e040fb',
              pink: '#ff2a85',
              purple: '#7928ca',
              green: '#00e59b',
              amber: '#ffb300',
              red: '#ff4d6d'
            }
          }
        }
      }
    };
  </script>

  <!-- React 18, ReactDOM, Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase & Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      background-color: #050816;
      background-image: 
        radial-gradient(circle at 10% 12%, rgba(0, 210, 255, 0.32) 0%, transparent 48%),
        radial-gradient(circle at 90% 18%, rgba(224, 64, 251, 0.36) 0%, transparent 52%),
        radial-gradient(circle at 50% 70%, rgba(121, 40, 202, 0.32) 0%, transparent 58%),
        radial-gradient(circle at 85% 85%, rgba(255, 42, 133, 0.28) 0%, transparent 45%),
        radial-gradient(circle at 15% 90%, rgba(0, 229, 155, 0.18) 0%, transparent 40%);
      background-attachment: fixed;
      color: #f1f5f9;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #050816; }
    ::-webkit-scrollbar-thumb { background: #1a2550; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #00d2ff; }
    .cyber-glass {
      background: rgba(12, 19, 46, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 210, 255, 0.22);
    }
    .brand-gradient {
      background: linear-gradient(135deg, #00d2ff 0%, #a855f7 50%, #e040fb 100%);
    }
    .brand-gradient-text {
      background: linear-gradient(135deg, #ffffff 0%, #a5f3fc 40%, #f0abfc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="min-h-screen relative font-sans antialiased selection:bg-cyan-500 selection:text-black">
  <canvas id="neuralCanvas" class="fixed inset-0 pointer-events-none z-0 opacity-65"></canvas>
  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Vector SVG Symbols Dictionary ---
    const Icons = {
      Trash: ({ className = "w-4 h-4" }) => (

      Sparkles: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3Z"/>
        </svg>
      ),
      Scan: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 7V5a2 2 0 0 1 2-2h2m10 0h2a2 2 0 0 1 2 2v2m0 10v2a2 2 0 0 1-2 2h-2m-10 0H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/>
        </svg>
      ),
      Chart: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">

      FileText: ({ className = "w-4 h-4" }) => (

          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
      ),
      MessageCircle: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
      ),
      User: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
      ),
      Star: ({ className = "w-4 h-4", filled = true }) => (
        <svg className={className} viewBox="0 0 24 24" fill={filled ? "currentColor" : "none"} stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
      ),
      Bug: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <rect width="8" height="14" x="8" y="6" rx="4"/><path d="m19 7-3 2"/><path d="m5 7 3 2"/><path d="m19 19-3-2"/><path d="m5 19 3-2"/><path d="M20 13h-4"/><path d="M4 13h4"/><path d="m10 4 1 2"/><path d="m14 4-1 2"/>
        </svg>
      ),
      Send: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>

      ),
      Settings: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82l-.06-.06a1.65 1.65 0 0 0-1.82-.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      ),
      Refresh: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>
        </svg>
      ),
      CheckCircle: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      ),
      Sliders: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="1" x2="7" y1="14" y2="14"/><line x1="9" x2="15" y1="8" y2="8"/><line x1="17" x2="23" y1="16" y2="16"/>
        </svg>
      )
    };

    const SUPABASE_URL = 'https://ykqzefulvpqfiwsddnqt.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlrcXplZnVsdnBxZml3c2RkbnF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3NTI2NTcsImV4cCI6MjA5ODMyODY1N30.NFm5dT7vVeHtziEkYWN-qk8ZEogpktPZ7NTmXDLO1Qs';
    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;

    const DEFAULT_WHITELIST = [
      'milanrajbow@gmail.com',
      'milanraj616@gmail.com',
      'sagar.23cs125@sode-edu.in',
      'rajanipatkar44@gmail.com',
      'ravidaspatkar@gmail.com',
      'manya.23cs070@sode-edu.in',
      'anithakunder616@gmail.com',
      'unknownperson12251978@gmail.com'
    ];

    const FEATURE_CONFIG = [
      { key: 'nlp_ocr', name: 'NLP OCR Receipt Parsing', icon: Icons.Scan, desc: 'Auto extraction of merchant, total, date & items' },
      { key: 'receipts', name: 'Receipt Vault & Search', icon: Icons.Receipt, desc: 'Encrypted storage with instant keyword search' },
      { key: 'warranty', name: 'Warranty Tracker', icon: Icons.ShieldCheck, desc: 'Automatic expiry countdown and warranty duration' },
      { key: 'reminders', name: 'Expiry Reminders', icon: Icons.Bell, desc: 'Scheduled notification before warranty lapses' },
      { key: 'ai_assistant', name: 'AI Financial Assistant', icon: Icons.Sparkles, desc: 'Intelligent queries about spending trends' },
      { key: 'analytics', name: 'Spending Analytics', icon: Icons.Chart, desc: 'Category breakdown and monthly spending charts' },
      { key: 'pdf', name: 'PDF Invoice & Report Export', icon: Icons.FileText, desc: 'One-click clean PDF receipt and warranty sheets' },
      { key: 'whatsapp', name: 'WhatsApp Bot Sync', icon: Icons.MessageCircle, desc: 'Forward receipt photos via WhatsApp bot' }
    ];

    function App() {
      const [step, setStep] = useState(1);
      const [feedbacks, setFeedbacks] = useState([]);
      const [whitelist, setWhitelist] = useState(DEFAULT_WHITELIST);
      const [loadingFeedbacks, setLoadingFeedbacks] = useState(true);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [toast, setToast] = useState(null);
      const [submittedSuccess, setSubmittedSuccess] = useState(false);
      const [expandedCardId, setExpandedCardId] = useState(null);

      const [formData, setFormData] = useState({
        name: '',
        email: '',
        deviceModel: '',
        androidVersion: 'Android 14',
        appVersion: '1.0.0 (Build 3)',
        testingDuration: '1–3 days',
        overallRating: 5,
        easeOfUse: 'Very Easy',
        features: {
          nlp_ocr: 5,
          receipts: 5,
          warranty: 5,
          reminders: 5,
          ai_assistant: 5,
          analytics: 5,
          pdf: 5,
          whatsapp: 5
        },
        manualCorrection: 'Rarely',
        uiDesign: 5,
        uiNav: 5,
        uiSpeed: 5,
        crashFrequency: 'Never',
        delayFrequency: 'Never',
        favFeature: '',
        impressedFeature: '',
        improvements: '',
        futureWishes: '',
        devMessage: '',
        continueUsing: 'Definitely Yes',
        hasBug: false,
        bugReport: {
          feature: 'General',
          severity: 'Low',
          description: '',
          steps: '',
          expected: '',
          actual: ''
        }
      });

      const showToast = (title, message, type = 'info') => {
        setToast({ title, message, type });
        setTimeout(() => setToast(null), 4000);
      };

      // 100% ONLINE CLOUD SYNC FROM SUPABASE
      const fetchCloudData = async () => {
        if (!supabase) return;
        setLoadingFeedbacks(true);
        try {
          const { data, error } = await supabase
            .from('feedbacks')
            .select('*')
            .order('created_at', { ascending: false });

          if (!error && data) {
            const configRow = data.find(r => r.name === '__SYSTEM_CONFIG_WHITELIST__' || r.email === 'system@receipto.whitelist');
            if (configRow) {
              try {
                const parsedConfig = JSON.parse(configRow.message);
                if (parsedConfig && Array.isArray(parsedConfig.whitelist) && parsedConfig.whitelist.length > 0) {
                  setWhitelist(parsedConfig.whitelist);
                }
              } catch (e) {}
            }

            const realFeedbacks = data
              .filter(r => r.name !== '__SYSTEM_CONFIG_WHITELIST__' && r.email !== 'system@receipto.whitelist')
              .map(row => {
                let parsed = null;
                try {
                  if (row.message && typeof row.message === 'string' && (row.message.startsWith('{') || row.message.startsWith('['))) {
                    parsed = JSON.parse(row.message);
                  }
                } catch (e) {}

                const ft = (parsed && parsed.features) ? parsed.features : (row.features || {});
                const sug = (parsed && parsed.suggestions) ? parsed.suggestions : {
                  favFeature: (parsed && parsed.favFeature) || (row.message && !row.message.startsWith('{') ? row.message : ''),
                  impressedFeature: (parsed && parsed.impressedFeature) || '',
                  improvements: (parsed && parsed.improvements) || '',
                  futureWishes: (parsed && parsed.futureWishes) || '',
                  devMessage: (parsed && parsed.devMessage) || ''
                };

                return {
                  id: row.id,
                  name: row.name || 'Anonymous Tester',
                  email: row.email || '',
                  device: row.device || 'Android Device',
                  rating: parseInt(row.rating) || 5,
                  message: (parsed && parsed.message) ? parsed.message : (row.message || ''),
                  features: ft,
                  suggestions: sug,
                  finalEvaluation: (parsed && parsed.finalEvaluation) || {
                    continueUsing: 'Definitely Yes',
                    devMessage: sug.devMessage || ''
                  },
                  bugReport: (parsed && parsed.bugReport) ? parsed.bugReport : null,
                  hasBug: parsed ? (parsed.hasBug || false) : (row.tags && row.tags.some(t => t.includes('Bug'))),
                  appVersion: (parsed && parsed.appVersion) || '1.0.0 (Build 3)',
                  testingDuration: (parsed && parsed.testingDuration) || '1–3 days',
                  date: row.created_at ? new Date(row.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Recently'
                };
              });

            setFeedbacks(realFeedbacks);
          }
        } catch (err) {
          console.error('Error fetching Supabase feedbacks:', err);
        } finally {
          setLoadingFeedbacks(false);
        }
      };

      useEffect(() => {
        fetchCloudData();
        if (supabase) {
          const channel = supabase
            .channel('public:feedbacks')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'feedbacks' }, () => {
              fetchCloudData();
            })
            .subscribe();
          return () => { supabase.removeChannel(channel); };
        }
      }, []);

      const emailStatus = useMemo(() => {
        const email = formData.email.trim().toLowerCase();
        if (!email) return null;
        if (!email.includes('@') || !email.includes('.')) {
          return { allowed: false, invalidFormat: true };
        }
        const isAllowed = whitelist.map(e => e.toLowerCase()).includes(email);
        return { allowed: isAllowed, invalidFormat: false };
      }, [formData.email, whitelist]);

      const handleNextStep1 = () => {
        if (!formData.name.trim()) {
          showToast('Name Required', 'Please enter your full name.', 'warning');
          return;
        }
        if (!formData.email.trim() || !formData.email.includes('@')) {
          showToast('Invalid Email', 'Please enter a valid email address.', 'warning');
          return;
        }
        if (!emailStatus || !emailStatus.allowed) {
          showToast('Access Restricted', 'Only authorized beta testers can submit evaluations. You can browse all community feedback below!', 'warning');
          return;
        }
        if (!formData.deviceModel.trim()) {
          showToast('Device Required', 'Please specify your Android device model.', 'warning');
          return;
        }
        setStep(2);
        window.scrollTo({ top: 380, behavior: 'smooth' });
      };

      const handleSubmit = async (e) => {
        if (e) e.preventDefault();
        if (!emailStatus || !emailStatus.allowed) {
          showToast('Access Denied', 'Only authorized beta testers can submit evaluations.', 'error');
          setStep(1);
          return;
        }

        setIsSubmitting(true);
        try {
          const cloudPayload = {
            message: formData.favFeature
              ? `★ Favourite: "${formData.favFeature}". Improve: "${formData.improvements}"`
              : `Overall Experience: ${formData.overallRating}/5. Testing duration: ${formData.testingDuration}.`,
            suggestions: {
              favFeature: formData.favFeature,
              impressedFeature: formData.impressedFeature,
              improvements: formData.improvements,
              futureWishes: formData.futureWishes,
              devMessage: formData.devMessage
            },
            finalEvaluation: {
              overallSatisfaction: formData.overallRating,
              continueUsing: formData.continueUsing,
              devMessage: formData.devMessage
            },
            features: formData.features,
            uiUx: {
              design: formData.uiDesign,
              nav: formData.uiNav,
              speed: formData.uiSpeed,
              crashFrequency: formData.crashFrequency,
              delayFrequency: formData.delayFrequency
            },
            easeOfUse: formData.easeOfUse,
            testingDuration: formData.testingDuration,
            appVersion: formData.appVersion,
            hasBug: formData.hasBug,
            bugReport: formData.hasBug ? formData.bugReport : null
          };

          const insertPayload = {
            name: formData.name,
            email: formData.email,
            device: `${formData.deviceModel} (${formData.androidVersion})`,
            rating: formData.overallRating,
            message: JSON.stringify(cloudPayload),
            tags: [
              `v${formData.appVersion.split(' ')[0]}`,
              formData.testingDuration,
              formData.hasBug ? '⚠️ Bug Logged' : '✅ Smooth'
            ]
          };

          if (supabase) {
            const { error } = await supabase.from('feedbacks').insert([insertPayload]);
            if (error) throw error;
          }

          if (window.confetti) {
            window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
          }

          setSubmittedSuccess(true);
          showToast('Success!', 'Thank you! Your beta evaluation is live on the Community Wall.', 'success');
          await fetchCloudData();
        } catch (err) {
          console.error('Submission error:', err);
          showToast('Submission Error', err.message || 'Failed to submit to database.', 'error');
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleDeleteFeedback = async (id) => {
        if (!confirm('Permanently delete this evaluation from the cloud?')) return;
        try {
          if (supabase) {
            const { error } = await supabase.from('feedbacks').delete().eq('id', id);
            if (error) throw error;
          }
          setFeedbacks(prev => prev.filter(f => f.id !== id));
          showToast('Deleted', 'Evaluation removed from Supabase cloud.', 'info');
        } catch (err) {
          showToast('Delete Failed', err.message, 'error');
        }
      };

      // Summary Statistics and Feature Breakdown
      const stats = useMemo(() => {
        const total = feedbacks.length;
        if (total === 0) {
          return {
            avg: '5.0',
            total: 0,
            bugs: 0,
            starsBreakdown: { 5: 0, 4: 0, 3: 0, 2: 0, 1: 0 },
            featureAverages: {
              nlp_ocr: '5.0',
              receipts: '5.0',
              warranty: '5.0',
              reminders: '5.0',
              ai_assistant: '5.0',
              analytics: '5.0',
              pdf: '5.0',
              whatsapp: '5.0'
            }
          };
        }

        let sum = 0;
        const starCounts = { 5: 0, 4: 0, 3: 0, 2: 0, 1: 0 };
        const featureSums = {};
        const featureCounts = {};

        feedbacks.forEach(f => {
          const r = Math.min(5, Math.max(1, parseInt(f.rating) || 5));
          sum += r;
          starCounts[r] = (starCounts[r] || 0) + 1;

          if (f.features) {
            Object.entries(f.features).forEach(([k, v]) => {
              if (typeof v === 'number') {
                featureSums[k] = (featureSums[k] || 0) + v;
                featureCounts[k] = (featureCounts[k] || 0) + 1;
              }
            });
          }
        });

        const featureAverages = {};
        FEATURE_CONFIG.forEach(cfg => {
          if (featureCounts[cfg.key] && featureCounts[cfg.key] > 0) {
            featureAverages[cfg.key] = (featureSums[cfg.key] / featureCounts[cfg.key]).toFixed(1);
          } else {
            featureAverages[cfg.key] = '5.0';
          }
        });

        const bugs = feedbacks.filter(f => f.hasBug || f.bugReport).length;

        return {
          avg: (sum / total).toFixed(1),
          total,
          bugs,
          starsBreakdown: starCounts,
          featureAverages
        };
      }, [feedbacks]);

      return (
        <div className="min-h-screen text-slate-100 flex flex-col justify-between">
          
          {/* Header with REAL RECEIPTO LOGO */}
          <header className="sticky top-0 z-50 cyber-glass border-b border-cyan-500/20 px-4 lg:px-8 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <img
                src="/logo.png"
                alt="Receipto"
                className="w-10 h-10 rounded-xl object-contain shadow-[0_0_20px_rgba(0,210,255,0.4)] border border-cyan-400/30"
              />
              <div>
                <div className="flex items-center gap-2">
                  <span className="font-extrabold tracking-wider text-white text-base">RECEIPTO</span>
                  <span className="text-[10px] uppercase font-mono px-2 py-0.5 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">
                    BETA 1.0.0
                  </span>
                </div>
                <p className="text-xs text-slate-400 hidden sm:block">Financial Intelligence & Automated Warranty Vault</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <div className="hidden md:flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-mono">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Supabase Live Cloud</span>
              </div>

              <a
                href="#communityWall"
                className="text-xs px-3 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700 transition"
              >
                Community Wall ({stats.total})
              </a>

              <a
                href="/admin"
                className="text-xs px-3 py-1.5 rounded-lg bg-purple-950/40 hover:bg-purple-900/60 text-purple-300 border border-purple-500/30 transition flex items-center gap-1.5 font-medium"
              >
                <Icons.Settings className="w-3.5 h-3.5 text-purple-400" />
                <span>Admin</span>
              </a>
            </div>
          </header>

          {/* Hero Banner */}
          <main className="max-w-5xl mx-auto px-4 py-8 flex-1 w-full">
            <div className="text-center mb-8">
              <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-cyan-500/15 border border-cyan-500/35 text-cyan-300 text-xs font-mono mb-4 shadow-sm">
                <Icons.ShieldCheck className="w-3.5 h-3.5 text-cyan-400" />
                <span>Google Play Closed Beta Testing Group</span>
              </div>
              <h1 className="text-3xl sm:text-5xl font-black brand-gradient-text tracking-tight mb-3">
                Receipto Beta Testing Evaluation
              </h1>
              <p className="text-slate-300 text-sm sm:text-base max-w-2xl mx-auto leading-relaxed">
                Thank you for testing Receipto. Your evaluations directly shape our automated warranty engine and official Google Play release.
              </p>

              {/* Stats Bar */}
              <div className="grid grid-cols-3 gap-3 max-w-lg mx-auto mt-6">
                <div className="cyber-glass rounded-xl p-3 text-center border-cyan-500/30">
                  <div className="text-2xl font-black text-cyan-400 flex items-center justify-center gap-1">
                    <Icons.Star className="w-5 h-5 text-amber-400" />
                    <span>{stats.avg}</span>
                  </div>
                  <div className="text-[11px] text-slate-400 uppercase tracking-wider mt-0.5">Community Avg</div>
                </div>
                <div className="cyber-glass rounded-xl p-3 text-center border-purple-500/30">
                  <div className="text-2xl font-black text-purple-400">{stats.total}</div>
                  <div className="text-[11px] text-slate-400 uppercase tracking-wider mt-0.5">Verified Reviews</div>
                </div>
                <div className="cyber-glass rounded-xl p-3 text-center border-emerald-500/30">
                  <div className="text-2xl font-black text-emerald-400">{whitelist.length}</div>
                  <div className="text-[11px] text-slate-400 uppercase tracking-wider mt-0.5">Active Testers</div>
                </div>
              </div>
            </div>

            {/* --- COMPREHENSIVE SCOREBOARD & FEATURE BREAKDOWN (More Info Like Before) --- */}
            <div className="cyber-glass rounded-2xl p-5 sm:p-6 mb-8 border-cyan-500/25 shadow-xl">
              <div className="flex flex-col lg:flex-row gap-6 items-center justify-between">
                
                {/* 5-Star Distribution Bars */}
                <div className="w-full lg:w-5/12 space-y-2 border-b lg:border-b-0 lg:border-r border-slate-800/80 pb-6 lg:pb-0 lg:pr-6">
                  <div className="flex items-center justify-between mb-2">
                    <div className="text-xs font-bold uppercase tracking-wider text-cyan-300">Rating Breakdown</div>
                    <div className="text-xs font-mono text-slate-400">{stats.total} Total Ratings</div>
                  </div>
                  {[5, 4, 3, 2, 1].map(star => {
                    const count = stats.starsBreakdown[star] || 0;
                    const pct = stats.total > 0 ? Math.round((count / stats.total) * 100) : (star === 5 ? 100 : 0);
                    return (
                      <div key={star} className="flex items-center gap-2 text-xs">
                        <span className="w-7 font-mono font-bold text-slate-300 flex items-center gap-0.5">
                          <span>{star}</span><span className="text-amber-400">★</span>
                        </span>
                        <div className="flex-1 h-2 rounded-full bg-slate-900 overflow-hidden border border-slate-800">
                          <div
                            className="h-full rounded-full brand-gradient transition-all duration-500"
                            style={{ width: `${pct}%` }}
                          ></div>
                        </div>
                        <span className="w-8 font-mono text-slate-400 text-right text-[11px]">{count}</span>
                      </div>
                    );
                  })}
                </div>

                {/* Core Feature Scores Summary Grid */}
                <div className="w-full lg:w-7/12">
                  <div className="text-xs font-bold uppercase tracking-wider text-purple-300 mb-2.5">
                    Core App Features Performance Scoreboard
                  </div>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    {FEATURE_CONFIG.map(feat => {
                      const FeatIcon = feat.icon;
                      const avgScore = stats.featureAverages[feat.key] || '5.0';
                      return (
                        <div key={feat.key} className="p-2.5 rounded-xl bg-slate-900/80 border border-slate-800/90 text-center">
                          <div className="flex justify-center mb-1 text-cyan-400">
                            <FeatIcon className="w-4 h-4" />
                          </div>
                          <div className="text-[11px] text-slate-300 font-medium truncate mb-0.5">{feat.name.split(' ')[0]}</div>
                          <div className="text-xs font-mono font-bold text-amber-400 flex items-center justify-center gap-0.5">
                            <Icons.Star className="w-3 h-3" />
                            <span>{avgScore}</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

              </div>

              {/* Three Architecture Badges */}
              <div className="mt-5 pt-4 border-t border-slate-800/80 grid grid-cols-1 sm:grid-cols-3 gap-3 text-center text-xs text-slate-300">
                <div className="flex items-center justify-center gap-2 p-2 rounded-lg bg-slate-900/50 border border-cyan-500/20">
                  <Icons.ShieldCheck className="w-4 h-4 text-cyan-400" />
                  <span>AES-256 GCM Encrypted Vault</span>
                </div>
                <div className="flex items-center justify-center gap-2 p-2 rounded-lg bg-slate-900/50 border border-purple-500/20">
                  <Icons.Scan className="w-4 h-4 text-purple-400" />
                  <span>PaddleOCR Supermarket Engine</span>
                </div>
                <div className="flex items-center justify-center gap-2 p-2 rounded-lg bg-slate-900/50 border border-emerald-500/20">
                  <Icons.Bell className="w-4 h-4 text-emerald-400" />
                  <span>Reboot-Resilient Push Reminders</span>
                </div>
              </div>
            </div>

            {/* Closed Beta Notice Card */}
            <div className="cyber-glass rounded-2xl p-4 sm:p-5 mb-8 border-cyan-500/30 bg-gradient-to-r from-cyan-950/20 via-purple-950/20 to-pink-950/20 flex items-start sm:items-center gap-4">
              <div className="p-2.5 rounded-xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 shrink-0">
                <Icons.Lock className="w-5 h-5" />
              </div>
              <div className="text-xs sm:text-sm text-slate-300 leading-relaxed flex-1">
                <span className="font-bold text-cyan-300">Closed Beta Access Notice:</span> Submission of evaluations is open exclusively to authorized Google Play beta testers. Enter your registered email in Step 1 to unlock the full evaluation form. <span className="text-slate-400">All visitors can freely explore community reviews below!</span>
              </div>
            </div>

            {/* Form Container */}
            {submittedSuccess ? (
              <div className="cyber-glass rounded-2xl p-8 text-center border-emerald-500/40 max-w-xl mx-auto my-8">
                <div className="w-16 h-16 rounded-full bg-emerald-500/20 border border-emerald-500/50 flex items-center justify-center mx-auto mb-4 text-emerald-400">
                  <Icons.CheckCircle className="w-8 h-8" />
                </div>
                <h3 className="text-2xl font-black text-white mb-2">Evaluation Submitted Live!</h3>
                <p className="text-slate-300 text-sm mb-6 leading-relaxed">
                  Thank you, <strong className="text-cyan-400">{formData.name}</strong>. Your feedback has been uploaded directly to our cloud database.
                </p>
                <div className="flex flex-wrap justify-center gap-3">
                  <button
                    onClick={() => { setSubmittedSuccess(false); setStep(1); }}
                    className="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold transition"
                  >
                    Submit Another Feedback
                  </button>
                  <a
                    href="#communityWall"
                    className="px-5 py-2.5 rounded-xl brand-gradient text-white text-xs font-semibold shadow-lg shadow-cyan-500/25 transition"
                  >
                    View Community Wall ↓
                  </a>
                </div>
              </div>
            ) : (
              <div className="cyber-glass rounded-2xl p-5 sm:p-8 border-cyan-500/20 shadow-2xl relative overflow-hidden mb-16">
                
                {/* Stepper Header */}
                <div className="flex items-center justify-between pb-6 border-b border-slate-800/80 mb-6 overflow-x-auto gap-2">
                  {[
                    { num: 1, title: 'Tester Info', icon: Icons.User },
                    { num: 2, title: 'Experience & OCR', icon: Icons.Star },
                    { num: 3, title: 'Core Features', icon: Icons.Receipt },
                    { num: 4, title: 'UI/UX & Speed', icon: Icons.Sliders },
                    { num: 5, title: 'Suggestions & Bugs', icon: Icons.MessageCircle }
                  ].map(s => {
                    const StepIcon = s.icon;
                    return (
                      <button
                        key={s.num}
                        type="button"
                        onClick={() => {
                          if (s.num < step || (s.num === 2 && emailStatus && emailStatus.allowed)) {
                            setStep(s.num);
                          }
                        }}
                        className={`flex items-center gap-2 text-xs font-semibold px-3 py-1.5 rounded-xl transition shrink-0 ${
                          step === s.num
                            ? 'bg-gradient-to-r from-cyan-500/20 to-purple-600/20 border border-cyan-400 text-cyan-300'
                            : step > s.num
                            ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'
                            : 'bg-slate-900/60 text-slate-500 border border-slate-800'
                        }`}
                      >
                        <StepIcon className="w-3.5 h-3.5" />
                        <span>{s.title}</span>
                      </button>
                    );
                  })}
                </div>

                {/* STEP 1: TESTER INFORMATION */}
                {step === 1 && (
                  <div className="space-y-6">
                    <div>
                      <h2 className="text-xl font-bold text-white flex items-center gap-2">
                        <Icons.User className="w-5 h-5 text-cyan-400" />
                        <span>Tester Information</span>
                      </h2>
                      <p className="text-xs text-slate-400 mt-1">
                        Enter your tester profile details so we can correlate metrics against device models.
                      </p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                          Full Name <span className="text-cyan-400">*</span>
                        </label>
                        <input
                          type="text"
                          value={formData.name}
                          onChange={e => setFormData({ ...formData, name: e.target.value })}
                          placeholder="e.g. Milanraj Kunder"
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700/80 focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 text-sm text-white placeholder-slate-500 outline-none transition"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                          Email Address (Registered Beta Tester) <span className="text-cyan-400">*</span>
                        </label>
                        <input
                          type="email"
                          value={formData.email}
                          onChange={e => setFormData({ ...formData, email: e.target.value })}
                          placeholder="your.email@gmail.com"
                          className={`w-full px-3.5 py-2.5 rounded-xl bg-slate-900/80 border text-sm text-white placeholder-slate-500 outline-none transition ${
                            emailStatus
                              ? emailStatus.allowed
                                ? 'border-emerald-500 focus:border-emerald-400'
                                : 'border-rose-500 focus:border-rose-400'
                              : 'border-slate-700/80 focus:border-cyan-400'
                          }`}
                        />

                        {emailStatus && (
                          <div className={`mt-2 p-2.5 rounded-xl text-xs flex items-start gap-2 ${
                            emailStatus.allowed
                              ? 'bg-emerald-500/10 border border-emerald-500/30 text-emerald-300'
                              : 'bg-rose-500/10 border border-rose-500/30 text-rose-300'
                          }`}>
                            <div className="mt-0.5">
                              {emailStatus.allowed ? <Icons.CheckCircle className="w-3.5 h-3.5 text-emerald-400" /> : <Icons.Lock className="w-3.5 h-3.5 text-rose-400" />}
                            </div>
                            <div>
                              {emailStatus.allowed ? (
                                <span><strong>Verified Beta Tester:</strong> Access granted to submit your evaluation.</span>
                              ) : emailStatus.invalidFormat ? (
                                <span>Please enter a complete and valid email address.</span>
                              ) : (
                                <span>
                                  <strong>Access Restricted:</strong> <code>{formData.email}</code> is not on the closed beta whitelist. Only approved beta testers can submit evaluations. You can browse all community feedback below.
                                </span>
                              )}
                            </div>
                          </div>
                        )}
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                          Device Brand & Model <span className="text-cyan-400">*</span>
                        </label>
                        <input
                          type="text"
                          value={formData.deviceModel}
                          onChange={e => setFormData({ ...formData, deviceModel: e.target.value })}
                          placeholder="e.g. OnePlus 11R 5G, Samsung S24, Pixel 8"
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700/80 focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 text-sm text-white placeholder-slate-500 outline-none transition"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                          Android OS Version <span className="text-cyan-400">*</span>
                        </label>
                        <select
                          value={formData.androidVersion}
                          onChange={e => setFormData({ ...formData, androidVersion: e.target.value })}
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700/80 focus:border-cyan-400 text-sm text-white outline-none transition"
                        >
                          {['Android 10', 'Android 11', 'Android 12', 'Android 13', 'Android 14', 'Android 15', 'Android 16', 'Other / Custom ROM'].map(v => (
                            <option key={v} value={v}>{v}</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1.5">Receipto App Version</label>
                        <input
                          type="text"
                          value={formData.appVersion}
                          readOnly
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/40 border border-cyan-500/30 text-cyan-400 font-mono text-sm outline-none"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1.5">Testing Duration</label>
                        <select
                          value={formData.testingDuration}
                          onChange={e => setFormData({ ...formData, testingDuration: e.target.value })}
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700/80 focus:border-cyan-400 text-sm text-white outline-none transition"
                        >
                          {['Less than one day', '1–3 days', '4–7 days', '1–2 weeks', 'More than two weeks'].map(d => (
                            <option key={d} value={d}>{d}</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div className="pt-4 flex justify-end">
                      <button
                        type="button"
                        onClick={handleNextStep1}
                        className="px-6 py-3 rounded-xl brand-gradient hover:opacity-95 text-white font-bold text-sm shadow-lg shadow-cyan-500/20 flex items-center gap-2 transition"
                      >
                        <span>Next: Overall Experience</span>
                        <span>→</span>
                      </button>
                    </div>
                  </div>
                )}

                {/* STEP 2: OVERALL EXPERIENCE & OCR */}
                {step === 2 && (
                  <div className="space-y-6">
                    <div>
                      <h2 className="text-xl font-bold text-white flex items-center gap-2">
                        <Icons.Star className="w-5 h-5 text-amber-400" />
                        <span>Overall Experience & NLP OCR</span>
                      </h2>
                      <p className="text-xs text-slate-400 mt-1">
                        Rate your personal satisfaction with Receipto and its automatic receipt recognition accuracy.
                      </p>
                    </div>

                    <div className="cyber-glass rounded-xl p-5 border-cyan-500/30 text-center">
                      <label className="block text-xs font-bold uppercase tracking-wider text-cyan-300 mb-2">
                        Overall Rating for Receipto
                      </label>
                      <div className="flex items-center justify-center gap-2 mb-2">
                        {[1, 2, 3, 4, 5].map(star => (
                          <button
                            key={star}
                            type="button"
                            onClick={() => setFormData({ ...formData, overallRating: star })}
                            className="p-1 transition transform hover:scale-125 focus:outline-none"
                          >
                            <Icons.Star
                              className={`w-8 h-8 sm:w-10 sm:h-10 ${star <= formData.overallRating ? 'text-amber-400' : 'text-slate-700'}`}
                              filled={star <= formData.overallRating}
                            />
                          </button>
                        ))}
                      </div>
                      <div className="text-xs font-mono text-slate-300">
                        {formData.overallRating} / 5.0 — {
                          formData.overallRating === 5 ? 'Exceptional Experience' :
                          formData.overallRating === 4 ? 'Very Good Experience' :
                          formData.overallRating === 3 ? 'Fair / Promising' : 'Needs Optimization'
                        }
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-2">
                        How easy was it to navigate and use the app?
                      </label>
                      <div className="grid grid-cols-3 gap-2">
                        {['Very Easy', 'Moderate', 'A Bit Complex'].map(opt => (
                          <button
                            key={opt}
                            type="button"
                            onClick={() => setFormData({ ...formData, easeOfUse: opt })}
                            className={`py-2.5 px-3 rounded-xl text-xs font-semibold border transition ${
                              formData.easeOfUse === opt
                                ? 'bg-cyan-500/20 border-cyan-400 text-cyan-300 shadow-sm'
                                : 'bg-slate-900/60 border-slate-800 text-slate-400 hover:border-slate-700'
                            }`}
                          >
                            {opt}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div className="cyber-glass rounded-xl p-4 border-slate-800">
                        <div className="flex items-center justify-between mb-2">
                          <span className="text-xs font-semibold text-slate-200 flex items-center gap-1.5">
                            <Icons.Scan className="w-3.5 h-3.5 text-cyan-400" />
                            <span>NLP Receipt Data Accuracy</span>
                          </span>
                          <span className="text-amber-400 text-xs font-bold font-mono">{formData.features.nlp_ocr}★</span>
                        </div>
                        <div className="flex gap-1.5">
                          {[1, 2, 3, 4, 5].map(s => (
                            <button
                              key={s}
                              type="button"
                              onClick={() => setFormData({
                                ...formData,
                                features: { ...formData.features, nlp_ocr: s }
                              })}
                              className={`flex-1 py-1 text-xs rounded font-bold flex items-center justify-center ${s <= formData.features.nlp_ocr ? 'bg-amber-400/20 text-amber-400' : 'bg-slate-800 text-slate-600'}`}
                            >
                              <Icons.Star className="w-3.5 h-3.5" filled={s <= formData.features.nlp_ocr} />
                            </button>
                          ))}
                        </div>
                      </div>

                      <div className="cyber-glass rounded-xl p-4 border-slate-800">
                        <label className="block text-xs font-semibold text-slate-200 mb-2">
                          Did you need to manually correct OCR items?
                        </label>
                        <select
                          value={formData.manualCorrection}
                          onChange={e => setFormData({ ...formData, manualCorrection: e.target.value })}
                          className="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white outline-none"
                        >
                          {['Never (100% accurate)', 'Rarely (occasional punctuation)', 'Sometimes', 'Frequently'].map(m => (
                            <option key={m} value={m}>{m}</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div className="pt-4 flex justify-between">
                      <button
                        type="button"
                        onClick={() => setStep(1)}
                        className="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs transition"
                      >
                        ← Back
                      </button>
                      <button
                        type="button"
                        onClick={() => { setStep(3); window.scrollTo({ top: 380, behavior: 'smooth' }); }}
                        className="px-6 py-2.5 rounded-xl brand-gradient hover:opacity-95 text-white font-bold text-xs shadow-lg transition"
                      >
                        Next: Core Features →
                      </button>
                    </div>
                  </div>
                )}

                {/* STEP 3: CORE APP FEATURES */}
                {step === 3 && (
                  <div className="space-y-6">
                    <div>
                      <h2 className="text-xl font-bold text-white flex items-center gap-2">
                        <Icons.Receipt className="w-5 h-5 text-cyan-400" />
                        <span>Core Feature Ratings</span>
                      </h2>
                      <p className="text-xs text-slate-400 mt-1">

                      </p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">

                        const score = formData.features[feat.key] || 5;
                        return (
                          <div key={feat.key} className="cyber-glass rounded-xl p-3.5 border-slate-800/80 hover:border-cyan-500/30 transition">
                            <div className="flex items-center justify-between mb-1">
                              <span className="text-xs font-bold text-white flex items-center gap-1.5">
                                <FeatIcon className="w-4 h-4 text-cyan-400" />
                                <span>{feat.name}</span>
                              </span>
                              <span className="text-amber-400 text-xs font-mono font-bold flex items-center gap-0.5">
                                <Icons.Star className="w-3.5 h-3.5" />
                                <span>{score}.0</span>
                              </span>
                            </div>
                            <p className="text-[11px] text-slate-400 mb-2.5">{feat.desc}</p>
                            <div className="flex gap-1">
                              {[1, 2, 3, 4, 5].map(val => (
                                <button
                                  key={val}
                                  type="button"
                                  onClick={() => setFormData({
                                    ...formData,
                                    features: { ...formData.features, [feat.key]: val }
                                  })}
                                  className={`flex-1 py-1 rounded text-xs transition flex items-center justify-center ${
                                    val <= score
                                      ? 'bg-amber-400/20 text-amber-300 font-bold'
                                      : 'bg-slate-900 text-slate-600 hover:text-slate-400'
                                  }`}
                                >
                                  <Icons.Star className="w-3.5 h-3.5" filled={val <= score} />
                                </button>
                              ))}
                            </div>
                          </div>
                        );

                      <button
                        type="button"
                        onClick={() => setStep(2)}
                        className="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs transition"
                      >
                        ← Back
                      </button>
                      <button
                        type="button"
                        onClick={() => { setStep(4); window.scrollTo({ top: 380, behavior: 'smooth' }); }}
                        className="px-6 py-2.5 rounded-xl brand-gradient hover:opacity-95 text-white font-bold text-xs shadow-lg transition"
                      >
                        Next: UI/UX & Speed →
                      </button>
                    </div>
                  </div>
                )}

                {/* STEP 4: UI/UX & SPEED */}
                {step === 4 && (
                  <div className="space-y-6">
                    <div>
                      <h2 className="text-xl font-bold text-white flex items-center gap-2">
                        <Icons.Sliders className="w-5 h-5 text-cyan-400" />
                        <span>UI/UX, Performance & Diagnostics</span>
                      </h2>
                      <p className="text-xs text-slate-400 mt-1">
                        Evaluate the visual design, launch speed, and crash frequency on your device.
                      </p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      {[
                        { label: 'Cyber Dark Visual Aesthetics', key: 'uiDesign' },
                        { label: 'Navigation Smoothness', key: 'uiNav' },
                        { label: 'App Response & Startup Speed', key: 'uiSpeed' }
                      ].map(item => (
                        <div key={item.key} className="cyber-glass rounded-xl p-4 border-slate-800 text-center">
                          <div className="text-xs font-semibold text-slate-300 mb-2">{item.label}</div>
                          <div className="text-lg font-bold text-amber-400 mb-2 flex items-center justify-center gap-1">
                            <Icons.Star className="w-4 h-4 text-amber-400" />
                            <span>{formData[item.key]}.0</span>
                          </div>
                          <div className="flex justify-center gap-1">
                            {[1, 2, 3, 4, 5].map(s => (
                              <button
                                key={s}
                                type="button"
                                onClick={() => setFormData({ ...formData, [item.key]: s })}
                                className={`w-7 h-7 rounded text-xs flex items-center justify-center ${s <= formData[item.key] ? 'bg-amber-400/20 text-amber-400' : 'bg-slate-900 text-slate-600'}`}

                                <Icons.Star className="w-3.5 h-3.5" filled={s <= formData[item.key]} />

                        >
                          {['Never (0 crashes, 100% stable)', 'Once', '2–3 times', 'Frequently'].map(c => (
                            <option key={c} value={c}>{c}</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                          UI Stutter or Animation Lag
                        </label>
                        <select
                          value={formData.delayFrequency}
                          onChange={e => setFormData({ ...formData, delayFrequency: e.target.value })}
                          className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700/80 text-xs text-white outline-none"
                        >
                          {['Never (Silky smooth 60/120fps)', 'Occasional minor frame drop', 'Noticeable lag'].map(c => (
                            <option key={c} value={c}>{c}</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div className="pt-4 flex justify-between">
                      <button
                        type="button"
                        onClick={() => setStep(3)}
                        className="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs transition"
                      >
                        ← Back
                      </button>
                      <button
                        type="button"
                        onClick={() => { setStep(5); window.scrollTo({ top: 380, behavior: 'smooth' }); }}
                        className="px-6 py-2.5 rounded-xl brand-gradient hover:opacity-95 text-white font-bold text-xs shadow-lg transition"
                      >
                        Next: Suggestions & Bugs →
                      </button>
                    </div>
                  </div>
                )}

                {/* STEP 5: SUGGESTIONS & BUGS */}
                {step === 5 && (

                      <h2 className="text-xl font-bold text-white flex items-center gap-2">
                        <Icons.MessageCircle className="w-5 h-5 text-cyan-400" />
                        <span>Suggestions & Diagnostics</span>
                      </h2>
                      <p className="text-xs text-slate-400 mt-1">
