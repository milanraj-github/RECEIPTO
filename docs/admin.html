<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipto — Beta Admin & Whitelist Command Console</title>
  <link rel="icon" type="image/png" href="/logo.png">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            cyber: {
              bg: '#050816',
              card: '#0c132e',
              border: 'rgba(0, 210, 255, 0.25)',
              hover: '#131e48',
              cyan: '#00d2ff',
              magenta: '#e040fb',
              pink: '#ff2a85',
              purple: '#7928ca',
              green: '#00e59b',
              amber: '#ffb300',
              red: '#ff4d6d'
            }
          }
        }
      }
    };
  </script>

  <!-- React 18, ReactDOM, Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase & SheetJS (Excel) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body {
      background-color: #050816;
      background-image: 
        radial-gradient(circle at 10% 12%, rgba(0, 210, 255, 0.32) 0%, transparent 48%),
        radial-gradient(circle at 90% 18%, rgba(224, 64, 251, 0.36) 0%, transparent 52%),
        radial-gradient(circle at 50% 70%, rgba(121, 40, 202, 0.32) 0%, transparent 58%),
        radial-gradient(circle at 85% 85%, rgba(255, 42, 133, 0.28) 0%, transparent 45%),
        radial-gradient(circle at 15% 90%, rgba(0, 229, 155, 0.18) 0%, transparent 40%);
      background-attachment: fixed;
      color: #f1f5f9;
      overflow-x: hidden;
    }
    .cyber-glass {
      background: rgba(12, 19, 46, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 210, 255, 0.22);
    }
    .brand-gradient {
      background: linear-gradient(135deg, #00d2ff 0%, #a855f7 50%, #e040fb 100%);
    }
  </style>
</head>
<body class="min-h-screen relative font-sans antialiased">
  <canvas id="adminCanvas" class="fixed inset-0 pointer-events-none z-0 opacity-55"></canvas>
  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const Icons = {
      Trash: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2m-6 5v6m4-6v6"/>
        </svg>
      ),
      Lock: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      ),
      ShieldCheck: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>
        </svg>
      ),
      Star: ({ className = "w-4 h-4", filled = true }) => (
        <svg className={className} viewBox="0 0 24 24" fill={filled ? "currentColor" : "none"} stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
      ),
      Refresh: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>
        </svg>
      ),
      FileText: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
      ),
      CheckCircle: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      ),
      Printer: ({ className = "w-4 h-4" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>
        </svg>
      )
    };

    const SUPABASE_URL = 'https://ykqzefulvpqfiwsddnqt.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlrcXplZnVsdnBxZml3c2RkbnF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3NTI2NTcsImV4cCI6MjA5ODMyODY1N30.NFm5dT7vVeHtziEkYWN-qk8ZEogpktPZ7NTmXDLO1Qs';
    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;

    const MASTER_PASSCODES = ['Milanrajjj@#12345', 'Milanraj@123', 'RECEIPTO_ADMIN_2026'];
    const DEFAULT_WHITELIST = [
      'ajayjkprabhu@gmail.com',
      'akshayjkprabhu@gmail.com',
      'ananyanayak802@gmail.com',
      'manjunathapatkarcs@gmail.com',
      'manyapatkar@gmail.com',
      'milanraj616@gmail.com',
      'nishanthpoojary572@gmail.com',
      'prashanth.23cs098@sode-edu.in',
      'ravidaspatkar@gmail.com',
      'sagar.23cs125@sode-edu.in',
      'sahanakaranth.cs@sode-edu.in',
      'sharanya8693@gmail.com',
      'shettymaithri7@gmail.com'
    ];

    function AdminApp() {
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        return sessionStorage.getItem('receipto_admin_unlocked') === 'true';
      });
      const [passInput, setPassInput] = useState('');
      const [authError, setAuthError] = useState('');

      const [feedbacks, setFeedbacks] = useState([]);
      const [whitelist, setWhitelist] = useState(DEFAULT_WHITELIST);
      const [whitelistRowId, setWhitelistRowId] = useState(null);
      const [newEmail, setNewEmail] = useState('');

      const [searchQuery, setSearchQuery] = useState('');
      const [ratingFilter, setRatingFilter] = useState('all');
      const [loading, setLoading] = useState(false);
      const [toast, setToast] = useState(null);
      const [expandedAdminId, setExpandedAdminId] = useState(null);

      const showToast = (msg, type = 'info') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      const handleLogin = (e) => {
        if (e) e.preventDefault();
        if (MASTER_PASSCODES.includes(passInput.trim())) {
          sessionStorage.setItem('receipto_admin_unlocked', 'true');
          setIsAuthenticated(true);
          setAuthError('');
        } else {
          setAuthError('Invalid master passcode. Access denied.');
        }
      };

      const handleLogout = () => {
        sessionStorage.removeItem('receipto_admin_unlocked');
        setIsAuthenticated(false);
      };

      // 100% Online fetch from Supabase
      const fetchAdminData = async () => {
        if (!supabase) return;
        setLoading(true);
        try {
          const { data, error } = await supabase
            .from('feedbacks')
            .select('*')
            .order('created_at', { ascending: false });

          if (!error && data) {
            const cfg = data.find(r => r.name === '__SYSTEM_CONFIG_WHITELIST__' || r.email === 'system@receipto.whitelist');
            if (cfg) {
              setWhitelistRowId(cfg.id);
              try {
                const parsed = JSON.parse(cfg.message);
                if (parsed && Array.isArray(parsed.whitelist) && parsed.whitelist.length > 0) {
                  setWhitelist(parsed.whitelist);
                }
              } catch (e) {}
            }

            const realList = data
              .filter(r => r.name !== '__SYSTEM_CONFIG_WHITELIST__' && r.email !== 'system@receipto.whitelist')
              .map(row => {
                let parsed = null;
                try {
                  if (row.message && (row.message.startsWith('{') || row.message.startsWith('['))) {
                    parsed = JSON.parse(row.message);
                  }
                } catch (e) {}

                const ft = (parsed && parsed.features) ? parsed.features : (row.features || {});
                const sug = (parsed && parsed.suggestions) ? parsed.suggestions : {
                  favFeature: (parsed && parsed.favFeature) || (row.message && !row.message.startsWith('{') ? row.message : ''),
                  impressedFeature: (parsed && parsed.impressedFeature) || '',
                  improvements: (parsed && parsed.improvements) || '',
                  futureWishes: (parsed && parsed.futureWishes) || '',
                  devMessage: (parsed && parsed.devMessage) || ''
                };

                return {
                  id: row.id,
                  name: row.name || 'Anonymous',
                  email: row.email || '',
                  device: row.device || 'Android',
                  rating: parseInt(row.rating) || 5,
                  features: ft,
                  suggestions: sug,
                  finalEvaluation: (parsed && parsed.finalEvaluation) || {},
                  hasBug: parsed ? (parsed.hasBug || false) : (row.tags && row.tags.some(t => t.includes('Bug'))),
                  bugReport: parsed ? parsed.bugReport : null,
                  appVersion: (parsed && parsed.appVersion) || '1.0.0 (Build 3)',
                  testingDuration: (parsed && parsed.testingDuration) || '1–3 days',
                  date: row.created_at ? new Date(row.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Recently'
                };
              });

            setFeedbacks(realList);
          }
        } catch (err) {
          console.error(err);
          showToast('Failed to load cloud feedbacks', 'error');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        if (isAuthenticated) {
          fetchAdminData();
        }
      }, [isAuthenticated]);

      const saveWhitelistToCloud = async (updatedList) => {
        setWhitelist(updatedList);
        if (!supabase) return;
        try {
          const payload = {
            name: '__SYSTEM_CONFIG_WHITELIST__',
            email: 'system@receipto.whitelist',
            device: 'Config',
            rating: 5,
            message: JSON.stringify({ whitelist: updatedList }),
            tags: ['whitelist']
          };

          if (whitelistRowId) {
            await supabase.from('feedbacks').update(payload).eq('id', whitelistRowId);
          } else {
            const { data } = await supabase.from('feedbacks').insert([payload]).select();
            if (data && data[0]) setWhitelistRowId(data[0].id);
          }
          showToast('Whitelist updated in cloud!', 'success');
        } catch (err) {
          showToast('Failed to update whitelist', 'error');
        }
      };

      const handleAddEmail = (e) => {
        if (e) e.preventDefault();
        const email = newEmail.trim().toLowerCase();
        if (!email || !email.includes('@') || !email.includes('.')) {
          alert('Please enter a valid email address.');
          return;
        }
        if (whitelist.includes(email)) {
          alert('This email is already whitelisted!');
          return;
        }
        const updated = [...whitelist, email];
        saveWhitelistToCloud(updated);
        setNewEmail('');
      };

      const handleRemoveEmail = (email) => {
        if (!confirm(`Revoke beta testing access for ${email}?`)) return;
        const updated = whitelist.filter(e => e !== email);
        saveWhitelistToCloud(updated);
      };

      const handleResetDefault = () => {
        if (!confirm('Reset whitelist back to the 8 default registered beta testers?')) return;
        saveWhitelistToCloud(DEFAULT_WHITELIST);
      };

      const handleDeleteFeedback = async (id) => {
        if (!confirm('Permanently delete this evaluation from Supabase cloud?')) return;
        try {
          if (supabase) {
            const { error } = await supabase.from('feedbacks').delete().eq('id', id);
            if (error) throw error;
          }
          setFeedbacks(prev => prev.filter(f => f.id !== id));
          showToast('Evaluation permanently deleted.', 'info');
        } catch (err) {
          showToast('Delete error: ' + err.message, 'error');
        }
      };

      const filteredFeedbacks = useMemo(() => {
        return feedbacks.filter(f => {
          if (ratingFilter === '5' && f.rating !== 5) return false;
          if (ratingFilter === '4' && f.rating !== 4) return false;
          if (ratingFilter === '3' && f.rating > 3) return false;
          if (ratingFilter === 'bugs' && !f.hasBug && !f.bugReport) return false;

          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const text = `${f.name} ${f.email} ${f.device} ${JSON.stringify(f.suggestions || {})} ${JSON.stringify(f.bugReport || {})}`.toLowerCase();
            return text.includes(q);
          }
          return true;
        });
      }, [feedbacks, ratingFilter, searchQuery]);

      const handleExportExcel = () => {
        if (!feedbacks.length) {
          alert('No feedback responses available to export.');
          return;
        }
        const rows = feedbacks.map(item => ({
          'Date': item.date,
          'Tester Name': item.name,
          'Email': item.email,
          'Device': item.device,
          'Rating': item.rating,
          'App Version': item.appVersion,
          'Testing Duration': item.testingDuration,
          'Favourite Feature': item.suggestions.favFeature || '',
          'Improvements': item.suggestions.improvements || '',
          'Future Wishlist': item.suggestions.futureWishes || '',
          'Note to Receipto Team': item.suggestions.devMessage || '',
          'Bug Encountered': (item.hasBug || item.bugReport) ? 'YES' : 'NO',
          'Bug Details': item.bugReport ? `${item.bugReport.feature} (${item.bugReport.severity}): ${item.bugReport.description}` : ''
        }));

        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Beta Feedbacks');
        XLSX.writeFile(wb, `Receipto_Beta_Feedback_${new Date().toISOString().split('T')[0]}.xlsx`);
      };

      // --- ITEM 2: EXPORT AS PDF ---
      const handleExportPDF = () => {
        if (!feedbacks.length) {
          alert('No feedback evaluations available to export as PDF.');
          return;
        }

        const printWin = window.open('', '_blank');
        if (!printWin) {
          alert('Please allow pop-ups to export as PDF.');
          return;
        }

        const rowsHtml = feedbacks.map((f, idx) => `
          <div style="border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px; margin-bottom: 12px; page-break-inside: avoid;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; margin-bottom: 8px;">
              <div>
                <strong style="font-size: 15px; color: #0f172a;">${idx + 1}. ${f.name}</strong>
                <span style="font-size: 12px; color: #64748b; margin-left: 8px;">&lt;${f.email}&gt;</span>
              </div>
              <div style="font-size: 14px; font-weight: bold; color: #0284c7;">
                ★ ${f.rating}.0 / 5.0
              </div>
            </div>

            <div style="font-size: 12px; color: #475569; margin-bottom: 8px;">
              <strong>Device:</strong> ${f.device} &nbsp;|&nbsp; 
              <strong>App Version:</strong> ${f.appVersion} &nbsp;|&nbsp; 
              <strong>Duration:</strong> ${f.testingDuration} &nbsp;|&nbsp; 
              <strong>Date:</strong> ${f.date}
            </div>

            ${f.features && Object.keys(f.features).length > 0 ? `
              <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px;">
                ${Object.entries(f.features).map(([k, v]) => `
                  <span style="background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 4px; padding: 2px 6px; font-size: 11px;">
                    ${k.replace('_', ' ')}: <strong>${v}★</strong>
                  </span>
                `).join('')}
              </div>
            ` : ''}

            ${f.suggestions.favFeature ? `
              <div style="font-size: 12px; margin-bottom: 4px;">
                <strong style="color: #0284c7;">Favourite Feature:</strong> "${f.suggestions.favFeature}"
              </div>
            ` : ''}

            ${f.suggestions.improvements ? `
              <div style="font-size: 12px; margin-bottom: 4px;">
                <strong style="color: #d97706;">Suggested Improvement:</strong> "${f.suggestions.improvements}"
              </div>
            ` : ''}

            ${f.suggestions.futureWishes ? `
              <div style="font-size: 12px; margin-bottom: 4px;">
                <strong style="color: #7c3aed;">Future Wishlist:</strong> "${f.suggestions.futureWishes}"
              </div>
            ` : ''}

            ${f.suggestions.devMessage ? `
              <div style="font-size: 12px; margin-bottom: 4px;">
                <strong style="color: #059669;">Note to Receipto Team:</strong> "${f.suggestions.devMessage}"
              </div>
            ` : ''}

            ${f.hasBug && f.bugReport ? `
              <div style="background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; padding: 8px; font-size: 11.5px; color: #991b1b; margin-top: 6px;">
                <strong>⚠️ Bug Diagnostic (${f.bugReport.feature} - ${f.bugReport.severity}):</strong> ${f.bugReport.description}
              </div>
            ` : ''}
          </div>
        `).join('');

        const docHtml = `
          <!DOCTYPE html>
          <html>
          <head>
            <title>Receipto Beta Evaluation Report - ${new Date().toISOString().split('T')[0]}</title>
            <style>
              body { font-family: 'Helvetica Neue', Arial, sans-serif; padding: 24px; color: #0f172a; }
              @media print {
                body { padding: 0; }
                button { display: none; }
              }
            </style>
          </head>
          <body>
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0f172a; padding-bottom: 12px; margin-bottom: 20px;">
              <div>
                <h1 style="margin: 0; font-size: 24px; color: #0f172a;">RECEIPTO</h1>
                <p style="margin: 2px 0 0; font-size: 13px; color: #64748b;">Official Beta Testing & Evaluation Cloud Report</p>
              </div>
              <div style="text-align: right; font-size: 12px; color: #64748b;">
                <div><strong>Generated:</strong> ${new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</div>
                <div><strong>Total Evaluations:</strong> ${feedbacks.length}</div>
                <div><strong>Average Rating:</strong> ${avgRating} / 5.0</div>
              </div>
            </div>

            <div style="margin-bottom: 16px;">
              <button onclick="window.print()" style="background: #0284c7; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;">
                Print / Save as PDF
              </button>
            </div>

            ${rowsHtml}
          </body>
          </html>
        `;

        printWin.document.write(docHtml);
        printWin.document.close();
        setTimeout(() => printWin.print(), 400);
      };

      const avgRating = feedbacks.length
        ? (feedbacks.reduce((a, b) => a + (b.rating || 5), 0) / feedbacks.length).toFixed(1)
        : '0.0';
      const bugCount = feedbacks.filter(f => f.hasBug || f.bugReport).length;

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="cyber-glass rounded-2xl p-8 max-w-md w-full border-cyan-500/30 text-center shadow-2xl">
              <img
                src="/logo.png"
                alt="Receipto"
                className="w-14 h-14 rounded-2xl object-contain mx-auto mb-4 border border-cyan-500/30 shadow-[0_0_20px_rgba(0,210,255,0.4)]"
              />
              <h2 className="text-xl font-black text-white mb-1">Receipto Admin Portal</h2>
              <p className="text-xs text-slate-400 mb-6">Enter master passcode to unlock beta testers & feedbacks manager</p>

              <form onSubmit={handleLogin} className="space-y-4">
                <input
                  type="password"
                  value={passInput}
                  onChange={e => setPassInput(e.target.value)}
                  placeholder="Enter Master Passcode..."
                  className="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 focus:border-cyan-400 text-sm text-white outline-none transition"
                  autoFocus
                />
                {authError && <div className="text-rose-400 text-xs font-semibold">{authError}</div>}
                <button
                  type="submit"
                  className="w-full py-2.5 rounded-xl brand-gradient hover:opacity-95 text-white font-bold text-xs shadow-lg transition"
                >
                  UNLOCK COMMAND CONSOLE →
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col justify-between">
          {/* Header with REAL RECEIPTO LOGO */}
          <header className="sticky top-0 z-50 cyber-glass border-b border-cyan-500/20 px-3 sm:px-6 lg:px-8 py-2.5 sm:py-3 flex items-center justify-between gap-2">
            <div className="flex items-center gap-2.5 sm:gap-3 min-w-0">
              <img
                src="/logo.png"
                alt="Receipto"
                className="w-8 h-8 sm:w-10 sm:h-10 rounded-xl object-contain shadow-[0_0_20px_rgba(0,210,255,0.4)] border border-cyan-400/30 shrink-0"
              />
              <div className="min-w-0">
                <div className="flex items-center gap-1.5 sm:gap-2">
                  <span className="font-extrabold text-white text-sm sm:text-base truncate">RECEIPTO ADMIN</span>
                  <span className="hidden sm:inline-flex text-[10px] uppercase font-mono px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-300 border border-purple-500/30 shrink-0">
                    Cloud Controller
                  </span>
                </div>
                <div className="text-xs text-slate-400 hidden sm:block truncate">Connected to Supabase Online Database</div>
              </div>
            </div>

            <div className="flex items-center gap-1.5 sm:gap-3 shrink-0">
              <a
                href="/"
                className="text-xs px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition whitespace-nowrap"
              >
                <span className="hidden sm:inline">← View Public Site</span>
                <span className="sm:hidden">← Site</span>
              </a>
              <button
                onClick={handleLogout}
                className="text-xs px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-lg bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 border border-rose-500/30 transition flex items-center gap-1.5 whitespace-nowrap"
              >
                <Icons.Lock className="w-3.5 h-3.5" />
                <span>Lock</span>
              </button>
            </div>
          </header>

          <main className="max-w-6xl mx-auto px-4 py-8 flex-1 w-full space-y-8">
            
            {/* Top Metrics Cards */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
              <div className="cyber-glass rounded-2xl p-4 border-cyan-500/25">
                <div className="text-xs text-slate-400 font-mono uppercase">Cloud Feedbacks</div>
                <div className="text-3xl font-black text-white mt-1">{feedbacks.length}</div>
              </div>
              <div className="cyber-glass rounded-2xl p-4 border-amber-500/25">
                <div className="text-xs text-slate-400 font-mono uppercase">Average Rating</div>
                <div className="text-3xl font-black text-amber-400 mt-1 flex items-center gap-1">
                  <Icons.Star className="w-6 h-6 text-amber-400" />
                  <span>{avgRating}</span>
                </div>
              </div>
              <div className="cyber-glass rounded-2xl p-4 border-rose-500/25">
                <div className="text-xs text-slate-400 font-mono uppercase">Bugs Reported</div>
                <div className="text-3xl font-black text-rose-400 mt-1">{bugCount}</div>
              </div>
              <div className="cyber-glass rounded-2xl p-4 border-emerald-500/25">
                <div className="text-xs text-slate-400 font-mono uppercase">Whitelisted Testers</div>
                <div className="text-3xl font-black text-emerald-400 mt-1">{whitelist.length}</div>
              </div>
            </div>

            {/* BETA TESTER WHITELIST ACCESS MANAGER */}
            <div className="cyber-glass rounded-2xl p-6 border-cyan-500/30">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-slate-800">
                <div>
                  <h2 className="text-lg font-bold text-white flex items-center gap-2">
                    <Icons.ShieldCheck className="w-5 h-5 text-cyan-400" />
                    <span>Beta Tester Whitelist Access Manager</span>
                  </h2>
                  <p className="text-xs text-slate-400 mt-0.5">
                    Only emails listed here are allowed to submit evaluation forms online. Syncs directly to Supabase.
                  </p>
                </div>
                <button
                  onClick={handleResetDefault}
                  className="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition shrink-0"
                >
                  Reset 13 Default Testers
                </button>
              </div>

              {/* Add Email Form */}
              <form onSubmit={handleAddEmail} className="flex gap-2 my-4">
                <input
                  type="email"
                  value={newEmail}
                  onChange={e => setNewEmail(e.target.value)}
                  placeholder="Enter tester email address to grant feedback access..."
                  className="flex-1 px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white outline-none focus:border-cyan-400 transition"
                />
                <button
                  type="submit"
                  className="px-4 py-2 rounded-xl brand-gradient hover:opacity-95 text-white font-bold text-xs transition"
                >
                  + Add Tester
                </button>
              </form>

              {/* Whitelist Tags Grid with REAL VECTOR TRASH CAN */}
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 max-h-60 overflow-y-auto pr-1">
                {whitelist.map(email => (
                  <div
                    key={email}
                    className="flex items-center justify-between px-3 py-2 rounded-xl bg-slate-900/80 border border-slate-800 text-xs font-mono"
                  >
                    <span className="text-cyan-300 truncate mr-2">🟢 {email}</span>
                    <button
                      type="button"
                      onClick={() => handleRemoveEmail(email)}
                      className="text-slate-500 hover:text-rose-400 p-1 rounded hover:bg-rose-500/10 transition"
                      title="Revoke access"
                    >
                      <Icons.Trash className="w-3.5 h-3.5" />
                    </button>
                  </div>
                ))}
              </div>
            </div>

            {/* FEEDBACK RESPONSES CONSOLE (WITH EXPORT PDF AND FULL INFO) */}
            <div className="cyber-glass rounded-2xl p-6 border-cyan-500/25">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-800">
                <div>
                  <h2 className="text-lg font-bold text-white flex items-center gap-2">
                    <Icons.FileText className="w-5 h-5 text-cyan-400" />
                    <span>Live Cloud Evaluations Console</span>
                  </h2>
                  <p className="text-xs text-slate-400 mt-0.5">
                    Real-time feedback records fetched directly from Supabase.
                  </p>
                </div>

                <div className="flex flex-wrap items-center gap-2">
                  {/* Export PDF Button */}
                  <button
                    onClick={handleExportPDF}
                    className="text-xs px-3 py-1.5 rounded-lg bg-cyan-600/25 hover:bg-cyan-600/40 text-cyan-300 border border-cyan-500/40 transition flex items-center gap-1.5 font-medium"
                    title="Print or save all evaluations as PDF report"
                  >
                    <Icons.Printer className="w-3.5 h-3.5 text-cyan-400" />
                    <span>Export PDF (.pdf)</span>
                  </button>

                  {/* Export Excel Button */}
                  <button
                    onClick={handleExportExcel}
                    className="text-xs px-3 py-1.5 rounded-lg bg-emerald-600/25 hover:bg-emerald-600/40 text-emerald-300 border border-emerald-500/40 transition flex items-center gap-1.5 font-medium"
                  >
                    <Icons.FileText className="w-3.5 h-3.5" />
                    <span>Export Excel (.xlsx)</span>
                  </button>

                  <button
                    onClick={fetchAdminData}
                    className="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition"
                    title="Refresh from cloud"
                  >
                    <Icons.Refresh className="w-3.5 h-3.5" />
                  </button>
                </div>
              </div>

              {/* Search & Filter Bar */}
              <div className="flex flex-col sm:flex-row gap-2 my-4">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  placeholder="Search evaluations by name, email, device or feedback text..."
                  className="flex-1 px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white outline-none focus:border-cyan-400 transition"
                />
                <select
                  value={ratingFilter}
                  onChange={e => setRatingFilter(e.target.value)}
                  className="px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white outline-none"
                >
                  <option value="all">All Ratings</option>
                  <option value="5">5 Stars Only</option>
                  <option value="4">4 Stars Only</option>
                  <option value="3">3 Stars or Below</option>
                  <option value="bugs">Bugs Reported Only</option>
                </select>
              </div>

              {/* Records Feed with FULL INFO AS COMMUNITY WALL */}
              {loading ? (
                <div className="py-12 text-center text-xs text-slate-400">Loading cloud evaluations...</div>
              ) : filteredFeedbacks.length === 0 ? (
                <div className="py-12 text-center text-xs text-slate-500">
                  No evaluations found matching your filters.
                </div>
              ) : (
                <div className="space-y-4 max-h-[800px] overflow-y-auto pr-1">
                  {filteredFeedbacks.map(f => (
                    <div
                      key={f.id}
                      className="p-5 rounded-2xl bg-slate-900/80 border border-slate-800 hover:border-cyan-500/35 transition text-xs space-y-3 shadow-lg"
                    >
                      {/* Top Row */}
                      <div className="flex items-start justify-between gap-3">
                        <div className="flex items-center gap-3">
                          <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500/30 to-purple-500/30 border border-cyan-500/40 flex items-center justify-center font-bold text-cyan-300 text-base">
                            {(f.name || 'T')[0].toUpperCase()}
                          </div>
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="font-bold text-white text-sm">{f.name}</span>
                              <span className="text-cyan-400 font-mono text-xs">&lt;{f.email}&gt;</span>
                              <span className="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 font-mono flex items-center gap-1">
                                <Icons.CheckCircle className="w-2.5 h-2.5" />
                                <span>Verified Tester</span>
                              </span>
                            </div>
                            <div className="text-slate-400 font-mono text-[11px] mt-0.5">
                              {f.device} • {f.testingDuration} • {f.appVersion} • {f.date}
                            </div>
                          </div>
                        </div>

                        <div className="flex items-center gap-2">
                          <span className="text-amber-400 font-bold font-mono px-2 py-1 rounded bg-amber-400/10 border border-amber-400/30 flex items-center gap-1">
                            <Icons.Star className="w-3.5 h-3.5" />
                            <span>{f.rating}.0</span>
                          </span>
                          <button
                            onClick={() => handleDeleteFeedback(f.id)}
                            className="text-rose-400 hover:text-rose-300 px-2.5 py-1 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 transition flex items-center gap-1 text-[11px] font-medium"
                            title="Delete from Supabase"
                          >
                            <Icons.Trash className="w-3.5 h-3.5" />
                            <span>Delete</span>
                          </button>
                        </div>
                      </div>

                      {/* Rated Core Feature Tags Grid */}
                      {f.features && Object.keys(f.features).length > 0 && (
                        <div className="flex flex-wrap gap-1.5 pt-1">
                          {Object.entries(f.features).map(([k, val]) => (
                            <span
                              key={k}
                              className="text-[11px] font-mono px-2 py-0.5 rounded-md bg-slate-950 border border-slate-800 text-slate-300 flex items-center gap-1"
                            >
                              <span className="text-slate-500">{k.replace('_', ' ')}:</span>
                              <span className="text-amber-400 font-bold">{val}★</span>
                            </span>
                          ))}
                        </div>
                      )}

                      {/* Insight Quotes */}
                      <div className="space-y-2 text-xs pt-1">
                        {f.suggestions.favFeature && (
                          <div className="p-2.5 rounded-xl bg-cyan-950/20 border-l-2 border-cyan-400 text-slate-300">
                            <span className="font-bold text-cyan-300 text-[11px] uppercase tracking-wider block mb-0.5">
                              Favourite Feature
                            </span>
                            "{f.suggestions.favFeature}"
                          </div>
                        )}
                        {f.suggestions.improvements && (
                          <div className="p-2.5 rounded-xl bg-amber-950/20 border-l-2 border-amber-400 text-slate-300">
                            <span className="font-bold text-amber-300 text-[11px] uppercase tracking-wider block mb-0.5">
                              Suggested Improvement
                            </span>
                            "{f.suggestions.improvements}"
                          </div>
                        )}
                        {f.suggestions.futureWishes && (
                          <div className="p-2.5 rounded-xl bg-purple-950/20 border-l-2 border-purple-400 text-slate-300">
                            <span className="font-bold text-purple-300 text-[11px] uppercase tracking-wider block mb-0.5">
                              Future Wishlist
                            </span>
                            "{f.suggestions.futureWishes}"
                          </div>
                        )}
                        {f.suggestions.devMessage && (
                          <div className="p-2.5 rounded-xl bg-emerald-950/20 border-l-2 border-emerald-400 text-slate-300">
                            <span className="font-bold text-emerald-300 text-[11px] uppercase tracking-wider block mb-0.5">
                              Note to Receipto Team
                            </span>
                            "{f.suggestions.devMessage}"
                          </div>
                        )}
                      </div>

                      {/* Bug Alert */}
                      {f.hasBug && f.bugReport && (
                        <div className="p-3 rounded-xl bg-rose-950/30 border border-rose-500/40 text-rose-300 text-xs">
                          <div className="font-bold mb-1 flex items-center gap-1">
                            <Icons.Trash className="w-3.5 h-3.5 text-rose-400" />
                            <span>⚠️ Bug Diagnostic ({f.bugReport.feature} - Severity: {f.bugReport.severity})</span>
                          </div>
                          <div>{f.bugReport.description}</div>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>

          </main>

          {toast && (
            <div className={`fixed bottom-5 right-5 z-50 p-3.5 rounded-xl border text-xs shadow-2xl ${
              toast.type === 'success' ? 'bg-emerald-950 border-emerald-500 text-emerald-200' :
              toast.type === 'error' ? 'bg-rose-950 border-rose-500 text-rose-200' :
              'bg-slate-900 border-cyan-500 text-cyan-200'
            }`}>
              {toast.msg}
            </div>
          )}

          <footer className="border-t border-slate-800/80 py-4 text-center text-xs text-slate-500 bg-[#050816]">
            Receipto Admin Console • Connected to Supabase
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);

    (function() {
      const canvas = document.getElementById('adminCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let particles = [];
      function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      window.addEventListener('resize', resize);
      resize();
      for (let i = 0; i < 35; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.35,
          vy: (Math.random() - 0.5) * 0.35,
          radius: Math.random() * 1.8 + 0.9,
          color: i % 2 === 0 ? 'rgba(0, 210, 255, 0.60)' : 'rgba(224, 64, 251, 0.60)'
        });
      }
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0) p.x = canvas.width;
          if (p.x > canvas.width) p.x = 0;
          if (p.y < 0) p.y = canvas.height;
          if (p.y > canvas.height) p.y = 0;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();
        }
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>
</body>
</html>
