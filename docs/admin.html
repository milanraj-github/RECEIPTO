<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipto — Beta Admin & Whitelist Command Console</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/milanraj-github/RECEIPTO/main/assets/icons/app_icon.png">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            cyber: {
              bg: '#050713',
              card: '#0a0f26',
              border: '#1a224a',
              hover: '#131c44',
              cyan: '#00f2fe',
              purple: '#7928ca',
              green: '#00e59b',
              pink: '#ff007a',
              amber: '#ffaa00',
              red: '#ff4d4d',
            }
          }
        }
      }
    };
  </script>

  <!-- React 18, ReactDOM, Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase & SheetJS (Excel) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body {
      background-color: #050713;
      color: #f1f5f9;
      overflow-x: hidden;
    }
    .cyber-glass {
      background: rgba(10, 15, 38, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 242, 254, 0.15);
    }
  </style>
</head>
<body class="min-h-screen relative font-sans antialiased">
  <!-- Living Canvas Background -->
  <canvas id="adminCanvas" class="fixed inset-0 pointer-events-none z-0 opacity-30"></canvas>

  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SUPABASE_URL = 'https://ykqzefulvpqfiwsddnqt.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlrcXplZnVsdnBxZml3c2RkbnF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3NTI2NTcsImV4cCI6MjA5ODMyODY1N30.NFm5dT7vVeHtziEkYWN-qk8ZEogpktPZ7NTmXDLO1Qs';
    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;

    const MASTER_PASSCODES = ['Milanrajjj@#12345', 'Milanraj@123', 'RECEIPTO_ADMIN_2026'];
    const DEFAULT_WHITELIST = [
      'milanrajbow@gmail.com',
      'milanraj616@gmail.com',
      'sagar.23cs125@sode-edu.in',
      'rajanipatkar44@gmail.com',
      'ravidaspatkar@gmail.com',
      'manya.23cs070@sode-edu.in',
      'anithakunder616@gmail.com',
      'unknownperson12251978@gmail.com'
    ];

    function AdminApp() {
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        return sessionStorage.getItem('receipto_admin_unlocked') === 'true';
      });
      const [passInput, setPassInput] = useState('');
      const [authError, setAuthError] = useState('');

      const [feedbacks, setFeedbacks] = useState([]);
      const [whitelist, setWhitelist] = useState(DEFAULT_WHITELIST);
      const [whitelistRowId, setWhitelistRowId] = useState(null);
      const [newEmail, setNewEmail] = useState('');
      const [whitelistSearch, setWhitelistSearch] = useState('');

      const [searchQuery, setSearchQuery] = useState('');
      const [ratingFilter, setRatingFilter] = useState('all');
      const [loading, setLoading] = useState(false);
      const [toast, setToast] = useState(null);

      const showToast = (msg, type = 'info') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      const handleLogin = (e) => {
        if (e) e.preventDefault();
        if (MASTER_PASSCODES.includes(passInput.trim())) {
          sessionStorage.setItem('receipto_admin_unlocked', 'true');
          setIsAuthenticated(true);
          setAuthError('');
        } else {
          setAuthError('Invalid master passcode. Access denied.');
        }
      };

      const handleLogout = () => {
        sessionStorage.removeItem('receipto_admin_unlocked');
        setIsAuthenticated(false);
      };

      // Fetch cloud data from Supabase
      const fetchAdminData = async () => {
        if (!supabase) return;
        setLoading(true);
        try {
          const { data, error } = await supabase
            .from('feedbacks')
            .select('*')
            .order('created_at', { ascending: false });

          if (!error && data) {
            // 1. Whitelist row
            const cfg = data.find(r => r.name === '__SYSTEM_CONFIG_WHITELIST__' || r.email === 'system@receipto.whitelist');
            if (cfg) {
              setWhitelistRowId(cfg.id);
              try {
                const parsed = JSON.parse(cfg.message);
                if (parsed && Array.isArray(parsed.whitelist) && parsed.whitelist.length > 0) {
                  setWhitelist(parsed.whitelist);
                }
              } catch (e) {}
            }

            // 2. Real user feedbacks only
            const realList = data
              .filter(r => r.name !== '__SYSTEM_CONFIG_WHITELIST__' && r.email !== 'system@receipto.whitelist')
              .map(row => {
                let parsed = null;
                try {
                  if (row.message && (row.message.startsWith('{') || row.message.startsWith('['))) {
                    parsed = JSON.parse(row.message);
                  }
                } catch (e) {}

                const ft = (parsed && parsed.features) ? parsed.features : (row.features || {});
                const sug = (parsed && parsed.suggestions) ? parsed.suggestions : {
                  favFeature: (parsed && parsed.favFeature) || (row.message && !row.message.startsWith('{') ? row.message : ''),
                  impressedFeature: (parsed && parsed.impressedFeature) || '',
                  improvements: (parsed && parsed.improvements) || '',
                  futureWishes: (parsed && parsed.futureWishes) || '',
                  devMessage: (parsed && parsed.devMessage) || ''
                };

                return {
                  id: row.id,
                  name: row.name || 'Anonymous',
                  email: row.email || '',
                  device: row.device || 'Android',
                  rating: parseInt(row.rating) || 5,
                  features: ft,
                  suggestions: sug,
                  hasBug: parsed ? (parsed.hasBug || false) : (row.tags && row.tags.some(t => t.includes('Bug'))),
                  bugReport: parsed ? parsed.bugReport : null,
                  date: row.created_at ? new Date(row.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Recently',
                  rawCreated: row.created_at
                };
              });

            setFeedbacks(realList);
          }
        } catch (err) {
          console.error(err);
          showToast('Failed to load cloud feedbacks', 'error');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        if (isAuthenticated) {
          fetchAdminData();
        }
      }, [isAuthenticated]);

      // Save Whitelist to Supabase
      const saveWhitelistToCloud = async (updatedList) => {
        setWhitelist(updatedList);
        if (!supabase) return;
        try {
          const payload = {
            name: '__SYSTEM_CONFIG_WHITELIST__',
            email: 'system@receipto.whitelist',
            device: 'Config',
            rating: 5,
            message: JSON.stringify({ whitelist: updatedList }),
            tags: ['whitelist']
          };

          if (whitelistRowId) {
            await supabase.from('feedbacks').update(payload).eq('id', whitelistRowId);
          } else {
            const { data } = await supabase.from('feedbacks').insert([payload]).select();
            if (data && data[0]) setWhitelistRowId(data[0].id);
          }
          showToast('Whitelist updated in cloud!', 'success');
        } catch (err) {
          showToast('Failed to update whitelist', 'error');
        }
      };

      const handleAddEmail = (e) => {
        if (e) e.preventDefault();
        const email = newEmail.trim().toLowerCase();
        if (!email || !email.includes('@') || !email.includes('.')) {
          alert('Please enter a valid email address.');
          return;
        }
        if (whitelist.includes(email)) {
          alert('This email is already whitelisted!');
          return;
        }
        const updated = [...whitelist, email];
        saveWhitelistToCloud(updated);
        setNewEmail('');
      };

      const handleRemoveEmail = (email) => {
        if (!confirm(`Revoke beta testing access for ${email}?`)) return;
        const updated = whitelist.filter(e => e !== email);
        saveWhitelistToCloud(updated);
      };

      const handleResetDefault = () => {
        if (!confirm('Reset whitelist back to the 8 default registered beta testers?')) return;
        saveWhitelistToCloud(DEFAULT_WHITELIST);
      };

      // Delete feedback online from Supabase
      const handleDeleteFeedback = async (id) => {
        if (!confirm('Permanently delete this evaluation from Supabase cloud?')) return;
        try {
          if (supabase) {
            const { error } = await supabase.from('feedbacks').delete().eq('id', id);
            if (error) throw error;
          }
          setFeedbacks(prev => prev.filter(f => f.id !== id));
          showToast('Evaluation permanently deleted.', 'info');
        } catch (err) {
          showToast('Delete error: ' + err.message, 'error');
        }
      };

      // Filtered Feedbacks
      const filteredFeedbacks = useMemo(() => {
        return feedbacks.filter(f => {
          if (ratingFilter === '5' && f.rating !== 5) return false;
          if (ratingFilter === '4' && f.rating !== 4) return false;
          if (ratingFilter === '3' && f.rating > 3) return false;
          if (ratingFilter === 'bugs' && !f.hasBug && !f.bugReport) return false;

          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();
            const text = `${f.name} ${f.email} ${f.device} ${JSON.stringify(f.suggestions || {})}`.toLowerCase();
            return text.includes(q);
          }
          return true;
        });
      }, [feedbacks, ratingFilter, searchQuery]);

      // Excel Export
      const handleExportExcel = () => {
        if (!feedbacks.length) {
          alert('No feedback responses available to export.');
          return;
        }
        const rows = feedbacks.map(item => ({
          'Date': item.date,
          'Tester Name': item.name,
          'Email': item.email,
          'Device': item.device,
          'Rating': item.rating,
          'Favourite Feature': item.suggestions.favFeature || '',
          'Improvements': item.suggestions.improvements || '',
          'Future Wishlist': item.suggestions.futureWishes || '',
          'Note to Dev': item.suggestions.devMessage || '',
          'Bug Encountered': (item.hasBug || item.bugReport) ? 'YES' : 'NO'
        }));

        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Beta Feedbacks');
        XLSX.writeFile(wb, `Receipto_Beta_Feedback_${new Date().toISOString().split('T')[0]}.xlsx`);
      };

      // JSON Export
      const handleExportJSON = () => {
        if (!feedbacks.length) return;
        const blob = new Blob([JSON.stringify(feedbacks, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Receipto_Beta_Feedback_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
      };

      // Stats
      const avgRating = feedbacks.length
        ? (feedbacks.reduce((a, b) => a + (b.rating || 5), 0) / feedbacks.length).toFixed(1)
        : '0.0';
      const bugCount = feedbacks.filter(f => f.hasBug || f.bugReport).length;

      // Gate screen
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="cyber-glass rounded-2xl p-8 max-w-md w-full border-cyan-500/30 text-center shadow-2xl">
              <div className="w-14 h-14 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-3xl mx-auto mb-4 text-cyan-400">
                🔐
              </div>
              <h2 className="text-xl font-black text-white mb-1">Receipto Admin Portal</h2>
              <p className="text-xs text-slate-400 mb-6">Enter master passcode to unlock beta testers & feedbacks manager</p>

              <form onSubmit={handleLogin} className="space-y-4">
                <input
                  type="password"
                  value={passInput}
                  onChange={e => setPassInput(e.target.value)}
                  placeholder="Enter Master Passcode..."
                  className="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 focus:border-cyan-400 text-sm text-white outline-none transition"
                  autoFocus
                />
                {authError && <div className="text-rose-400 text-xs font-semibold">{authError}</div>}
                <button
                  type="submit"
                  className="w-full py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 text-white font-bold text-xs shadow-lg transition"
                >
                  UNLOCK COMMAND CONSOLE →
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col justify-between">
          {/* Header */}
          <header className="sticky top-0 z-50 cyber-glass border-b border-cyan-500/20 px-4 lg:px-8 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 p-[2px]">
                <div className="w-full h-full bg-[#050713] rounded-[10px] flex items-center justify-center font-bold text-cyan-400 text-lg">
                  R
                </div>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="font-extrabold text-white text-base">RECEIPTO ADMIN</span>
                  <span className="text-[10px] uppercase font-mono px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-300 border border-purple-500/30">
                    Cloud Controller
                  </span>
                </div>
                <div className="text-xs text-slate-400">Connected to Supabase Online Database</div>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <a
                href="/"
                className="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition"
              >
                ← View Public Site
              </a>
              <button
                onClick={handleLogout}
                className="text-xs px-3 py-1.5 rounded-lg bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 border border-rose-500/30 transition"
              >
                Lock 🔒
              </button>
            </div>
          </header>

          <main className="max-w-6xl mx-auto px-4 py-8 flex-1 w-full space-y-8">
            
            {/* Top Metrics Cards */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
              <div className="cyber-glass rounded-2xl p-4 border-cyan-500/20">
                <div className="text-xs text-slate-400 font-mono uppercase">Cloud Feedbacks</div>
                <div className="text-3xl font-black text-white mt-1">{feedbacks.length}</div>
              </div>
              <div className="cyber-glass rounded-2xl p-4 border-amber-500/20">
                <div className="text-xs text-slate-400 font-mono uppercase">Average Rating</div>
                <div className="text-3xl font-black text-amber-400 mt-1">★ {avgRating}</div>
              </div>
              <div className="cyber-glass rounded-2xl p-4 border-rose-500/20">
                <div className="text-xs text-slate-400 font-mono uppercase">Bugs Reported</div>
                <div className="text-3xl font-black text-rose-400 mt-1">{bugCount}</div>
              </div>
              <div className="cyber-glass rounded-2xl p-4 border-emerald-500/20">
                <div className="text-xs text-slate-400 font-mono uppercase">Whitelisted Testers</div>
                <div className="text-3xl font-black text-emerald-400 mt-1">{whitelist.length}</div>
              </div>
            </div>

            {/* --- BETA TESTER WHITELIST ACCESS MANAGER --- */}
            <div className="cyber-glass rounded-2xl p-6 border-cyan-500/30">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-slate-800">
                <div>
                  <h2 className="text-lg font-bold text-white flex items-center gap-2">
                    <span>🛡️</span> <span>Beta Tester Whitelist Access Manager</span>
                  </h2>
                  <p className="text-xs text-slate-400 mt-0.5">
                    Only emails listed here are allowed to submit evaluation forms online. Syncs directly to Supabase.
                  </p>
                </div>
                <button
                  onClick={handleResetDefault}
                  className="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition shrink-0"
                >
                  Reset 8 Default Testers
                </button>
              </div>

              {/* Add Email Form */}
              <form onSubmit={handleAddEmail} className="flex gap-2 my-4">
                <input
                  type="email"
                  value={newEmail}
                  onChange={e => setNewEmail(e.target.value)}
                  placeholder="Enter tester email address to grant feedback access..."
                  className="flex-1 px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white outline-none focus:border-cyan-400 transition"
                />
                <button
                  type="submit"
                  className="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-black font-bold text-xs transition"
                >
                  + Add Tester
                </button>
              </form>

              {/* Whitelist Tags Grid */}
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 max-h-60 overflow-y-auto pr-1">
                {whitelist.map(email => (
                  <div
                    key={email}
                    className="flex items-center justify-between px-3 py-2 rounded-xl bg-slate-900/80 border border-slate-800 text-xs font-mono"
                  >
                    <span className="text-cyan-300 truncate mr-2">🟢 {email}</span>
                    <button
                      type="button"
                      onClick={() => handleRemoveEmail(email)}
                      className="text-slate-500 hover:text-rose-400 transition"
                      title="Revoke access"
                    >
                      🗑️
                    </button>
                  </div>
                ))}
              </div>
            </div>

            {/* --- FEEDBACK RESPONSES CONSOLE --- */}
            <div className="cyber-glass rounded-2xl p-6 border-cyan-500/20">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-800">
                <div>
                  <h2 className="text-lg font-bold text-white flex items-center gap-2">
                    <span>📊</span> <span>Live Cloud Evaluations Console</span>
                  </h2>
                  <p className="text-xs text-slate-400 mt-0.5">
                    Real-time feedback records fetched directly from Supabase.
                  </p>
                </div>

                <div className="flex flex-wrap items-center gap-2">
                  <button
                    onClick={handleExportExcel}
                    className="text-xs px-3 py-1.5 rounded-lg bg-emerald-600/30 hover:bg-emerald-600/50 text-emerald-300 border border-emerald-500/40 transition flex items-center gap-1.5"
                  >
                    <span>📊</span> Export Excel (.xlsx)
                  </button>
                  <button
                    onClick={handleExportJSON}
                    className="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition"
                  >
                    JSON
                  </button>
                  <button
                    onClick={fetchAdminData}
                    className="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs transition"
                    title="Refresh from cloud"
                  >
                    🔄
                  </button>
                </div>
              </div>

              {/* Search & Filter Bar */}
              <div className="flex flex-col sm:flex-row gap-2 my-4">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  placeholder="Search evaluations by name, email, device or feedback text..."
                  className="flex-1 px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white outline-none focus:border-cyan-400 transition"
                />
                <select
                  value={ratingFilter}
                  onChange={e => setRatingFilter(e.target.value)}
                  className="px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white outline-none"
                >
                  <option value="all">All Ratings</option>
                  <option value="5">5 Stars Only</option>
                  <option value="4">4 Stars Only</option>
                  <option value="3">3 Stars or Below</option>
                  <option value="bugs">Bugs Reported Only</option>
                </select>
              </div>

              {/* Records Feed */}
              {loading ? (
                <div className="py-12 text-center text-xs text-slate-400">Loading cloud evaluations...</div>
              ) : filteredFeedbacks.length === 0 ? (
                <div className="py-12 text-center text-xs text-slate-500">
                  No evaluations found matching your filters.
                </div>
              ) : (
                <div className="space-y-3 max-h-[700px] overflow-y-auto pr-1">
                  {filteredFeedbacks.map(f => (
                    <div
                      key={f.id}
                      className="p-4 rounded-xl bg-slate-900/60 border border-slate-800 hover:border-cyan-500/30 transition text-xs space-y-2"
                    >
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-white text-sm">{f.name}</span>
                          <span className="text-cyan-400 font-mono text-[11px]">&lt;{f.email}&gt;</span>
                          <span className="text-slate-500 text-[11px] font-mono">• {f.device} • {f.date}</span>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className="text-amber-400 font-bold font-mono">★ {f.rating}.0</span>
                          <button
                            onClick={() => handleDeleteFeedback(f.id)}
                            className="text-rose-400 hover:text-rose-300 p-1 rounded bg-rose-500/10 border border-rose-500/20"
                            title="Delete from Supabase"
                          >
                            🗑️
                          </button>
                        </div>
                      </div>

                      {/* Quotes */}
                      {f.suggestions.favFeature && (
                        <div className="text-slate-300">
                          <span className="text-cyan-400 font-semibold">Fav:</span> "{f.suggestions.favFeature}"
                        </div>
                      )}
                      {f.suggestions.improvements && (
                        <div className="text-slate-300">
                          <span className="text-amber-400 font-semibold">Improve:</span> "{f.suggestions.improvements}"
                        </div>
                      )}
                      {f.suggestions.devMessage && (
                        <div className="text-emerald-300">
                          <span className="font-semibold">Note to Dev:</span> "{f.suggestions.devMessage}"
                        </div>
                      )}
                      {f.hasBug && f.bugReport && (
                        <div className="p-2 rounded bg-rose-950/20 border border-rose-500/30 text-rose-300 text-[11px]">
                          <strong>Bug:</strong> {f.bugReport.feature} ({f.bugReport.severity}) — {f.bugReport.description}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>

          </main>

          {/* Toast */}
          {toast && (
            <div className={`fixed bottom-5 right-5 z-50 p-3.5 rounded-xl border text-xs shadow-2xl ${
              toast.type === 'success' ? 'bg-emerald-950 border-emerald-500 text-emerald-200' :
              toast.type === 'error' ? 'bg-rose-950 border-rose-500 text-rose-200' :
              'bg-slate-900 border-cyan-500 text-cyan-200'
            }`}>
              {toast.msg}
            </div>
          )}

          <footer className="border-t border-slate-800/80 py-4 text-center text-xs text-slate-500 bg-[#04060f]">
            Receipto Admin Console • Connected to Supabase
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);

    // Particles
    (function() {
      const canvas = document.getElementById('adminCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let particles = [];
      function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      window.addEventListener('resize', resize);
      resize();
      for (let i = 0; i < 30; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          radius: Math.random() * 1.5 + 0.8
        });
      }
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(121, 40, 202, 0.4)';
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0) p.x = canvas.width;
          if (p.x > canvas.width) p.x = 0;
          if (p.y < 0) p.y = canvas.height;
          if (p.y > canvas.height) p.y = 0;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>
</body>
</html>
