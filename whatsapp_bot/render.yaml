services:
  - type: web
    name: receipto-whatsapp-bot
    env: docker
    dockerfilePath: ./whatsapp_bot/Dockerfile
    dockerContext: ./whatsapp_bot
    plan: free
    region: singapore
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: 10000
